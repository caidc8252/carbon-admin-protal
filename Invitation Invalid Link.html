<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invitation · Invalid link</title>
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/components.css" />
  <link rel="stylesheet" href="screens/onboarding-flow.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font-family-sans); color: var(--color-text-primary); background: var(--color-bg-1); -webkit-font-smoothing: antialiased; }
    *, *::before, *::after { box-sizing: border-box; }
    #root { height: 100%; }
    button { font-family: inherit; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot-splash > div:first-child { animation: none; } }
  </style>
  <script>
    window.__INVALID_TWEAKS__ = /*EDITMODE-BEGIN*/{
      "reason": "Unknown token",
      "theme": "light"
    }/*EDITMODE-END*/;
  </script>
</head>
<body>
  <div id="root">
    <div id="boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--color-bg-1);font-family:var(--font-family-sans);">
      <div style="width:34px;height:34px;border-radius:50%;border:2.5px solid var(--color-border-default);border-top-color:var(--color-primary-700);animation:boot-spin 0.7s linear infinite;"></div>
      <div style="font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text-tertiary);">Loading invitation</div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="data-tables.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="onboarding.jsx"></script>

  <script type="text/babel">
    const { useState: useStateBad, useEffect: useEffBad } = React;

    // Each "reason" maps to a representative bad token string. The token is
    // echoed verbatim in the invalid-link message (onboarding.jsx · OBInvalid).
    const REASON_TOKENS = {
      'Unknown token':   'not-a-real-token',
      'Already used':    'inv-7k2qp-consumed',
      'Expired link':    'inv-3p9xk-2026-04',
      'Tampered link':   'aHR0cHM6Ly9iYWQ%2F',
    };
    const REASONS = Object.keys(REASON_TOKENS);

    function InvalidDemo() {
      const [t, setTweak] = window.useTweaks(window.__INVALID_TWEAKS__);

      useEffBad(() => {
        document.documentElement.dataset.theme = t.theme === 'dark' ? 'dark' : 'light';
      }, [t.theme]);

      const token = REASON_TOKENS[t.reason] || REASON_TOKENS['Unknown token'];

      return (
        <>
          <window.Onboarding
            key={token}
            token={token}
            invitation={null}
            currentUser={null}
            onExit={() => { window.location.href = encodeURI('Invitation Sign-in and Sign-out.html'); }}
          />

          <window.TweaksPanel title="Tweaks">
            <window.TweakSection label="Invalid reason" />
            <window.TweakSelect
              label="Why it failed"
              value={t.reason}
              options={REASONS}
              onChange={(v) => setTweak('reason', v)} />
            <window.TweakSection label="Appearance" />
            <window.TweakRadio
              label="Theme"
              value={t.theme}
              options={['light', 'dark']}
              onChange={(v) => setTweak('theme', v)} />
          </window.TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <window.ToastProvider>
        <InvalidDemo />
      </window.ToastProvider>
    );
  </script>
</body>
</html>
