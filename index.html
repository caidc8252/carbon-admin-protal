    .ad-pubrow { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--color-border-subtle); }
    .ad-link-btn { display: inline-flex; align-items: center; gap: 4px; margin-top: 14px; padding: 6px 10px; background: var(--color-bg-3); border: 1px solid var(--color-border-default); border-radius: 6px; font: 500 12.5px var(--font-family-sans); color: var(--color-text-primary); cursor: pointer; transition: all 0.12s; }
    .ad-link-btn:hover { background: var(--color-bg-hover); border-color: var(--color-border-strong); }
    .ad-reach { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; text-align: center; }
    .ad-reach__val { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--color-text-primary); }
    .ad-state-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
    .ad-state-row .muted { font-size: 12px; }

    /* App detail header: pills should sit inline with title text without */
    /* breaking onto separate lines on narrow viewports. */
    .det-header__title .tds-badge { font-size: 11px; vertical-align: middle; }

    /* ─── Overview tab (mirrors ISV portal) ───────────── */
    .ov-kvstack { display: flex; flex-direction: column; }
    .ov-kv { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--color-border-subtle); }
    .ov-kv:last-child { border-bottom: 0; }
    .ov-kv__label { font: 500 10.5px var(--font-family-sans); color: var(--color-text-tertiary); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
    .ov-kv__value { text-align: right; min-width: 0; font-size: 13px; color: var(--color-text-primary); }
    .ov-kv__sub { font: 400 10.5px var(--font-family-mono); color: var(--color-text-tertiary); margin-top: 2px; }
    .ov-divider { margin: 14px 0 12px; border-top: 1px dashed var(--color-border-subtle); }
    .ov-section-label { font: 500 10.5px var(--font-family-sans); color: var(--color-text-tertiary); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
    .ov-shots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    @media (max-width: 720px) { .ov-shots { grid-template-columns: repeat(2, 1fr); } }
    .ov-shot { aspect-ratio: 9 / 16; border-radius: 10px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .ov-shot__chrome { display: flex; gap: 4px; padding: 8px 10px; background: var(--color-bg-2); border-bottom: 1px solid var(--color-border-subtle); }
    .ov-shot__chrome span { width: 6px; height: 6px; border-radius: 50%; background: var(--color-border-strong); opacity: 0.5; }
    .ov-shot__body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--color-text-tertiary); padding: 8px; }
    .ov-shot__label { font: 500 10.5px var(--font-family-mono); color: var(--color-text-tertiary); text-align: center; letter-spacing: 0.02em; }

    /* ─── Version detail (shared by Published Apps + App Publish) ─── */
    /* These styles power both <VersionDetail/> (Carbon admin shell) and the
       App Publish bundle's VersionDetailScreen — they're hoisted here so the
       rules exist regardless of which route is active. */
    .vd-grid { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: start; }
    @media (max-width: 980px) { .vd-grid { grid-template-columns: 1fr; } }
    .vd-kvgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); row-gap: 0; column-gap: 36px; }
    .vd-kvrow { display: flex; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--color-border-subtle); min-width: 0; }
    .vd-kvrow__label { width: 150px; flex-shrink: 0; font-size: 12px; color: var(--color-text-tertiary); }
    .vd-kvrow__value { flex: 1; min-width: 0; font-size: 13px; font-weight: 450; color: var(--color-text-primary); overflow-wrap: anywhere; word-break: normal; }
    .vd-kv { display: contents; }
    .vd-kv__label { font: 500 11px var(--font-family-sans); color: var(--color-text-tertiary); letter-spacing: 0.06em; text-transform: uppercase; align-self: center; }
    .vd-kv__value { font-size: 13px; color: var(--color-text-primary); align-self: center; }
    .vd-scan-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 16px 12px; }
    .vd-scan-head__num { font: 500 32px var(--font-family-mono); letter-spacing: -0.03em; line-height: 1; }
    .vd-scan-head__lbl { font-size: 11px; color: var(--color-text-tertiary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .vd-scan-head__status { padding-bottom: 2px; }
    .vd-scan-bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--color-bg-3); margin: 0 16px; }
    .vd-scan-bar--clickable .vd-scan-bar__seg { border: 0; padding: 0; cursor: pointer; height: 100%; transition: filter 0.12s, transform 0.12s; transform-origin: center; }
    .vd-scan-bar--clickable .vd-scan-bar__seg:hover { filter: brightness(1.12); transform: scaleY(1.6); }
    .vd-sevlist { display: flex; flex-direction: column; margin-top: 6px; padding: 0 8px 4px; }
    .vd-sevrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font-family: inherit; padding: 8px 8px; border: 0; background: transparent; border-radius: 6px; cursor: default; transition: background 0.12s; min-height: 32px; }
    .vd-sevrow.is-clickable { cursor: pointer; }
    .vd-sevrow.is-clickable:hover { background: var(--color-bg-hover, var(--color-bg-3)); }
    .vd-sevrow.is-clickable:focus-visible { outline: 2px solid var(--accent, var(--color-primary-700)); outline-offset: -2px; }
    .vd-sevrow.is-empty { opacity: 0.45; }
    .vd-sevrow__dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .vd-sevrow__label { flex: 1; font-size: 12.5px; color: var(--color-text-secondary); }
    .vd-sevrow.is-clickable .vd-sevrow__label { color: var(--color-text-primary); font-weight: 450; }
    .vd-sevrow__val { font: 500 14px var(--font-family-mono); letter-spacing: -0.01em; min-width: 24px; text-align: right; }
    .vd-sevrow__go { color: var(--color-text-tertiary); opacity: 0; transition: opacity 0.12s, transform 0.12s; flex: none; }
    .vd-sevrow.is-clickable:hover .vd-sevrow__go { opacity: 1; transform: translateX(2px); }
    .vd-scan-foot { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; padding: 10px 12px; border: 0; border-top: 1px solid var(--color-border-subtle); background: transparent; color: var(--accent, var(--color-primary-700)); font: 500 12.5px var(--font-family-sans); cursor: pointer; transition: background 0.12s; }
    .vd-scan-foot:hover { background: var(--color-bg-hover, var(--color-bg-3)); }
    .vd-scan-foot:focus-visible { outline: 2px solid var(--accent, var(--color-primary-700)); outline-offset: -2px; }
    .vd-scan-callout { display: flex; align-items: flex-start; gap: 8px; margin: 0 12px 12px; padding: 9px 11px; background: color-mix(in oklab, var(--color-error-500) 8%, transparent); border: 1px solid color-mix(in oklab, var(--color-error-500) 25%, transparent); border-radius: var(--radius-md, 6px); font-size: 11.5px; color: var(--color-error-700); line-height: 1.5; }
    .vd-scan-callout svg { margin-top: 2px; flex: none; }
    .vd-sevchip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border: 1px solid var(--color-border-default); border-radius: 999px; background: var(--color-bg-2); font: 500 12px var(--font-family-sans); color: var(--color-text-secondary); cursor: pointer; transition: border-color 0.12s, background 0.12s, color 0.12s; }
    .vd-sevchip:hover { border-color: var(--color-border-strong); color: var(--color-text-primary); }
    .vd-sevchip.is-active { border-color: var(--accent, var(--color-primary-700)); background: color-mix(in oklab, var(--accent, var(--color-primary-700)) 10%, transparent); color: var(--accent, var(--color-primary-700)); }
    .vd-sevchip__dot { width: 7px; height: 7px; border-radius: 50%; }
    .vd-sevtiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .vd-sevtile { padding: 10px 12px; border-radius: 7px; border: 1px solid var(--color-border-subtle); border-left: 3px solid; min-width: 0; }
    .vd-sevtile__lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; color: var(--color-text-tertiary); }
    .vd-sevtile__num { font: 500 22px var(--font-family-mono); margin-top: 2px; letter-spacing: -0.02em; }
    .vd-findings-btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px 4px 8px; margin: -4px -6px -4px 0; border: 0; background: transparent; font: 500 12px var(--font-family-sans); color: var(--color-text-primary); cursor: pointer; border-radius: 6px; transition: background 0.12s; }
    .vd-findings-btn:hover { background: var(--color-bg-hover, var(--color-bg-3)); }
    .vd-perms-link { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 13px; color: var(--accent, var(--color-primary-700)); cursor: pointer; font-weight: 500; text-decoration: underline; text-underline-offset: 2px; text-decoration-style: dotted; text-decoration-color: var(--color-border-default); }
    .vd-perms-link:hover { color: var(--color-primary-800, var(--color-primary-700)); text-decoration-color: currentColor; }
    .vd-finding { padding: 14px 18px; }
    .vd-finding__head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .vd-finding__id { font: 500 10px var(--font-family-sans); text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 999px; border: 1px solid; background: var(--color-bg-2); white-space: nowrap; }
    .vd-finding__title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); flex: 1; min-width: 0; }
    .vd-finding__meta { margin-top: 6px; font-size: 11.5px; color: var(--color-text-tertiary); display: flex; gap: 6px; flex-wrap: wrap; }
    .vd-finding__meta code { font-family: var(--font-family-mono); font-size: 11px; padding: 1px 5px; background: var(--color-bg-3); border-radius: 4px; border: 1px solid var(--color-border-subtle); }
    .vd-finding__detail { margin: 8px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--color-text-secondary); }
    .vd-shots-toggle { display: flex; align-items: center; gap: 12px; width: 100%; padding: 20px 14px; border: 1px dashed var(--color-border-default); border-radius: 10px; background: var(--color-bg-3); cursor: pointer; transition: background 0.12s, border-color 0.12s; color: var(--color-text-secondary); }
    .vd-shots-toggle:hover { background: var(--color-bg-2); border-color: var(--color-border-strong); }
    .vd-shots-toggle__icon { width: 36px; height: 36px; border-radius: 8px; background: var(--color-bg-2); border: 1px solid var(--color-border-subtle); display: grid; place-items: center; color: var(--color-text-tertiary); flex: none; }

    /* ─── Tickets (tickets.jsx) ───────────────────────────────────── */
    /* The Tickets module uses a full-bleed layout (no .page max-width)
       to match the source Carbon Customer Portal — title strip + tabs
       up top, filters + table below, scrollable independently. */
    .tkt-screen { display: flex; flex-direction: column; height: 100%; overflow: hidden; background: var(--color-bg-1); }
    .tkt-screen__head { background: var(--color-bg-2); border-bottom: 1px solid var(--color-border-default); flex-shrink: 0; }
    .tkt-screen__headrow { display: flex; align-items: flex-start; gap: 16px; padding: 20px 28px 4px; }
    .tkt-screen__headrow > .tkt-screen__title { flex: 1; min-width: 0; }
    .tkt-screen__title h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .tkt-screen__title p { margin: 6px 0 0; font-size: 13px; color: var(--color-text-tertiary); max-width: 720px; line-height: 1.5; }
    .tkt-screen__actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; padding-top: 4px; }
    .tkt-screen__tabs { display: flex; gap: 28px; padding: 12px 28px 0; align-items: flex-end; }
    .tkt-screen__tab { display: inline-flex; align-items: center; gap: 8px; padding: 8px 0 10px; border: 0; background: transparent; cursor: pointer; position: relative;
                       font-size: 13.5px; font-weight: 500; color: var(--color-text-tertiary); }
    .tkt-screen__tab:hover { color: var(--color-text-secondary); }
    .tkt-screen__tab.is-on { color: var(--color-text-primary); font-weight: 600; }
    .tkt-screen__tab.is-on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--color-text-primary); border-radius: 2px; }
    .tkt-screen__tabcount { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--color-bg-3); color: var(--color-text-secondary); border: 1px solid var(--color-border-default); font-variant-numeric: tabular-nums; }
    .tkt-screen__body { flex: 1; overflow: auto; }
    .tkt-screen__filters { display: flex; align-items: center; gap: 10px; padding: 18px 28px 10px; flex-wrap: wrap; }
    .tkt-screen__filters .tds-input { width: auto; min-width: 240px; max-width: 380px; flex: 1 1 240px; }
    .tkt-screen__count { margin-left: auto; font-size: 11.5px; color: var(--color-text-tertiary); }
    .tkt-screen__tablewrap { padding: 4px 28px 32px; }
    .tkt-screen__tablecard { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); overflow: hidden; }
    .tkt-screen__tablecard table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tkt-screen__tablecard thead tr { background: var(--color-bg-3); }
    .tkt-screen__tablecard thead th { padding: 10px 14px; font-size: 10.5px; font-weight: 600; text-align: left; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-tertiary); border-bottom: 1px solid var(--color-border-default); white-space: nowrap; }
    .tkt-screen__tablecard tbody td { padding: 12px 14px; border-bottom: 1px solid var(--color-border-subtle); vertical-align: middle; }
    .tkt-screen__tablecard tbody tr:last-child td { border-bottom: 0; }
    .tkt-screen__tablecard tbody tr.is-clickable { cursor: pointer; transition: background 0.12s; }
    .tkt-screen__tablecard tbody tr.is-clickable:hover { background: var(--color-bg-hover); }

    /* KPI strip — slim row of 4, sits between the header and filters */
    .tkt-kpi { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 14px 28px 0; }
    .tkt-kpi__tile { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 10px; padding: 10px 14px; cursor: pointer; text-align: left; transition: border-color 0.12s, background 0.12s; }
    .tkt-kpi__tile:hover { background: var(--color-bg-hover); }
    .tkt-kpi__tile.is-on { border-color: var(--color-primary-300); background: var(--color-primary-50); }
    .tkt-kpi__label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-tertiary); margin-bottom: 4px; }
    .tkt-kpi__val { font-size: 22px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--color-text-primary); }
    .tkt-kpi__sub { font-size: 11px; color: var(--color-text-tertiary); margin-top: 2px; }

    /* Source / type / origin chips in table */
    .tkt-source-stack { display: inline-flex; flex-direction: column; gap: 3px; align-items: flex-start; }
    .tkt-source-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; font: 600 9.5px var(--font-family-mono); letter-spacing: 0.06em; text-transform: uppercase; }
    .tkt-source-chip--auto   { background: var(--color-info-50);    color: var(--color-info-700); }
    .tkt-source-chip--manual { background: var(--color-bg-3);       color: var(--color-text-secondary); }
    .tkt-origin-chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600; }
    .tkt-origin-chip--iso       { background: var(--color-info-50);    color: var(--color-info-700); }
    .tkt-origin-chip--npt       { background: var(--color-warning-50); color: var(--color-warning-700); }

    .tkt-type-chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
    .tkt-type-chip--error    { background: var(--color-error-50);   color: var(--color-error-700); }
    .tkt-type-chip--warning  { background: var(--color-warning-50); color: var(--color-warning-700); }
    .tkt-type-chip--info     { background: var(--color-info-50);    color: var(--color-info-700); }
    .tkt-type-chip--neutral  { background: var(--color-bg-3);       color: var(--color-text-secondary); }

    /* Cell layouts */
    .ticket-title-cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; max-width: 220px; }
    .ticket-title-cell__title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ticket-title-cell__sub { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--color-text-tertiary); }
    .ticket-title-cell__sub .mono { font-size: 10.5px; }

    .tkt-status-cell { display: inline-flex; flex-direction: column; gap: 3px; align-items: flex-start; }
    .tkt-status-cell__sub { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; font: 500 10.5px var(--font-family-mono); color: var(--color-text-tertiary); }

    /* Back link */
    .tkt-back { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; margin-left: -8px; border-radius: 6px; background: transparent; border: 0; color: var(--color-text-secondary); font-size: 12.5px; cursor: pointer; }
    .tkt-back:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }

    /* Detail header */
    .tkt-detail__head { display: flex; align-items: flex-start; gap: 14px; padding: 16px 28px 0; background: var(--color-bg-2); border-bottom: 1px solid var(--color-border-default); flex-wrap: wrap; }
    .tkt-detail__head--inner { flex: 1; min-width: 320px; }
    .tkt-detail__chiprow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tkt-detail__id { font: 600 13px var(--font-family-mono); color: var(--color-text-tertiary); letter-spacing: 0.02em; white-space: nowrap; }
    .tkt-detail__title { margin: 6px 0 0; font-size: 19px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; text-wrap: pretty; max-width: 880px; }
    .tkt-detail__meta { margin-top: 6px; padding-bottom: 14px; font-size: 12px; color: var(--color-text-tertiary); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .tkt-detail__meta span { display: inline-flex; align-items: center; gap: 6px; }
    .tkt-detail__actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; padding-bottom: 14px; margin-left: auto; }

    .tkt-detail__stepwrap { background: var(--color-bg-2); border-bottom: 1px solid var(--color-border-default); padding: 12px 28px 16px; }
    .tkt-detail__body { padding: 20px 28px 28px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
    @media (max-width: 1100px) { .tkt-detail__body { grid-template-columns: minmax(0, 1fr); } }

    /* Status stepper */
    .tkt-stepper { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 0; }
    .tkt-stepper__step { display: inline-flex; align-items: center; gap: 8px; color: var(--color-text-tertiary); }
    .tkt-stepper__step.is-passed { color: var(--color-success-700); }
    .tkt-stepper__step.is-here { color: var(--color-primary-700); }
    .tkt-stepper__dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 600; font-family: var(--font-family-mono); flex-shrink: 0;
                       background: var(--color-bg-3); color: var(--color-text-tertiary); border: 1px solid var(--color-border-default); }
    .tkt-stepper__step.is-passed .tkt-stepper__dot { background: var(--color-success-50); color: var(--color-success-700); border-color: var(--color-success-200); }
    .tkt-stepper__step.is-here .tkt-stepper__dot { background: var(--color-primary-50); color: var(--color-primary-700); border-color: var(--color-primary-200); }
    .tkt-stepper__label { font-size: 11.5px; font-weight: 500; white-space: nowrap; }
    .tkt-stepper__step.is-here .tkt-stepper__label { font-weight: 600; }
    .tkt-stepper__bar { width: 32px; height: 1px; background: var(--color-border-strong); margin: 0 8px; flex-shrink: 0; }
    .tkt-stepper__bar.is-passed { background: var(--color-success-500); }
    .tkt-stepper__role-badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 4px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
    .tkt-stepper__role-badge--iso { background: var(--color-info-50); color: var(--color-info-700); border: 1px solid var(--color-info-200); }
    .tkt-stepper__role-badge--npt { background: var(--color-primary-50); color: var(--color-primary-700); border: 1px solid var(--color-primary-200); }

    /* Detail cards (lighter than the global .info-card to match source density) */
    .tkt-card { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); overflow: hidden; }
    .tkt-card + .tkt-card { margin-top: 14px; }
    .tkt-card__head { padding: 11px 16px; border-bottom: 1px solid var(--color-border-subtle); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .tkt-card__title { font-size: 13px; font-weight: 600; color: var(--color-text-primary); }
    .tkt-card__hint  { font-size: 11.5px; color: var(--color-text-tertiary); }
    .tkt-card__body  { padding: 14px 16px; font-size: 13px; line-height: 1.55; }
    .tkt-card__body--tight { padding: 10px 14px; }
    .tkt-card__body--scroll { max-height: 380px; overflow: auto; }

    /* Comments */
    .tkt-comments { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
    .tkt-comment { display: flex; gap: 10px; align-items: flex-start; }
    .tkt-comment__avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
                          font-size: 10.5px; font-weight: 600; font-family: var(--font-family-mono);
                          background: var(--color-bg-3); color: var(--color-text-secondary); border: 1px solid var(--color-border-default); }
    .tkt-comment.is-npt .tkt-comment__avatar { background: var(--color-warning-50); color: var(--color-warning-700); border-color: var(--color-warning-200); }
    .tkt-comment.is-iso .tkt-comment__avatar { background: var(--color-info-50);    color: var(--color-info-700);    border-color: var(--color-info-200); }
    .tkt-comment__body { flex: 1; min-width: 0; }
    .tkt-comment__meta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .tkt-comment__actor { font-size: 12.5px; font-weight: 500; color: var(--color-text-primary); }
    .tkt-comment__chip { font: 600 9px var(--font-family-mono); padding: 1px 5px; border-radius: 3px; letter-spacing: 0.06em; text-transform: uppercase; }
    .tkt-comment__chip--npt { background: var(--color-warning-50); color: var(--color-warning-700); }
    .tkt-comment__chip--iso { background: var(--color-info-50);    color: var(--color-info-700); }
    .tkt-comment__at { font-size: 10.5px; color: var(--color-text-tertiary); }
    .tkt-comment__text { padding: 8px 12px; background: var(--color-bg-1); border: 1px solid var(--color-border-default); border-radius: 8px;
                        font-size: 13px; color: var(--color-text-primary); line-height: 1.55; white-space: pre-wrap; text-wrap: pretty; }

    /* Composer */
    .tkt-composer__label { font: 600 9.5px var(--font-family-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); margin-bottom: 6px; }

    /* Right-side context rows + grants */
    .tkt-ctx-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .tkt-grants { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .tkt-grants li { display: inline-flex; align-items: center; gap: 8px; padding: 5px 9px; border-radius: 6px;
                    background: var(--color-bg-1); border: 1px solid var(--color-border-default);
                    color: var(--color-text-tertiary); font-size: 12px; }
    .tkt-grants li.is-on { background: var(--color-success-50); border-color: var(--color-success-200); color: var(--color-success-700); }

    /* Timeline tighter version (rides on top of global .timeline / .tl-row) */
    .tkt-card .timeline { padding-left: 22px; }
    .tkt-card .timeline::before { left: 7px; }
    .tkt-card .tl-row { padding: 0 0 14px; }
    .tkt-card .tl-row__dot { left: -19px; top: 4px; width: 10px; height: 10px; }

    /* Roster cards in Assign dialog */
    .tkt-roster { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px;
                  border: 1px solid var(--color-border-default); background: var(--color-bg-1); cursor: pointer; transition: background 0.12s, border-color 0.12s; }
    .tkt-roster:hover { background: var(--color-bg-hover); }
    .tkt-roster.is-on { background: var(--color-primary-50); border-color: var(--color-primary-200); }
    .tkt-roster.is-queue { background: var(--color-bg-3); }
    .tkt-roster.is-queue.is-on { background: var(--color-warning-50); border-color: var(--color-warning-200); }
    .tkt-roster input[type="radio"] { margin: 0; }
    .tkt-roster__avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
                         background: var(--color-bg-2); border: 1px solid var(--color-border-default);
                         font-size: 11px; font-weight: 600; font-family: var(--font-family-mono); color: var(--color-text-secondary); }
    .tkt-roster.is-on .tkt-roster__avatar { background: var(--color-primary-100); color: var(--color-primary-700); border-color: var(--color-primary-200); }
    .tkt-roster.is-queue .tkt-roster__avatar { background: var(--color-warning-100); color: var(--color-warning-700); border-color: var(--color-warning-200); }
    .tkt-roster__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .tkt-roster__name { font-size: 13px; font-weight: 600; color: var(--color-text-primary); }
    .tkt-roster__sub  { font-size: 11.5px; color: var(--color-text-tertiary); }

    /* New ticket — keep within a reasonable form width like a wizard */
    .tkt-new { max-width: 920px; margin: 0 auto; padding: 24px 28px 48px; }

    /* Tickets module ignores the global .page wrapper — but our shell
       still gives content 1200px max. Make the content area let
       tickets bleed by removing the .page only when we add this class
       to its parent. We just wrap our screens with a div that's not
       .page, since app.jsx renders us directly inside .content. */
  </style>

    window.__CARBON_TWEAKS__ = /*EDITMODE-BEGIN*/{

    <div id="boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--color-bg-1);font-family:var(--font-family-sans);">
      <div style="width:34px;height:34px;border-radius:50%;border:2.5px solid var(--color-border-default);border-top-color:var(--color-primary-700);animation:boot-spin 0.7s linear infinite;"></div>
      <div style="font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text-tertiary);">Loading TOMS</div>

    <style>@keyframes boot-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){#boot-splash > div:first-child{animation:none}}</style>
