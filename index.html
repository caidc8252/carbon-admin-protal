    .setupkey__val { font-family: var(--font-family-mono); font-size: 14px; letter-spacing: 0.1em; color: var(--color-text-primary); background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 6px; padding: 7px 14px; }

    /* Switch partner */
    .up-ws-grid { display: grid; gap: 12px; }
    .up-ws { display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; cursor: pointer; transition: all var(--duration-fast); text-align: left; font-family: inherit; width: 100%; }
    .up-ws:hover { border-color: var(--color-border-strong); background: var(--color-bg-hover); }
    .up-ws.is-on { border-color: var(--color-primary-700); background: var(--color-primary-50); box-shadow: 0 0 0 3px oklch(40% 0.14 262 / 0.08); }
    .up-ws.is-locked { cursor: not-allowed; opacity: 0.62; }
    .up-ws.is-locked:hover { border-color: var(--color-border-default); background: var(--color-bg-2); }
    .up-ws__logo { width: 44px; height: 44px; border-radius: 11px; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; box-shadow: var(--shadow-cta); margin-top: 1px; }
    .up-ws__main { flex: 1; min-width: 0; }
    .up-ws__top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .up-ws__name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em; color: var(--color-text-primary); }
    .up-ws__chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .up-ws__meta { display: flex; align-items: center; gap: 7px; margin-top: 7px; font-size: 12px; color: var(--color-text-tertiary); flex-wrap: wrap; }
    .up-ws__portal { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; color: var(--color-text-secondary); }
    .up-ws__portal > svg { color: var(--color-text-tertiary); flex: none; }
    .up-ws__joined { font-variant-numeric: tabular-nums; }
    .up-ws__dot { color: var(--color-border-strong); }
    .up-ws__trail { color: var(--color-text-tertiary); flex: none; align-self: center; }
    .up-ws.is-on .up-ws__trail { color: var(--color-primary-700); }

    /* Contract-type chips */
    .up-ctype { font: 600 10.5px/1 var(--font-family-mono); letter-spacing: 0.04em; padding: 4px 7px; border-radius: 5px; border: 1px solid transparent; white-space: nowrap; }
    .up-ctype--iso, .up-ctype--isv { background: var(--color-primary-50); color: var(--color-primary-700); border-color: oklch(40% 0.14 262 / 0.2); }
    .up-ctype--merchant { background: var(--color-success-50); color: var(--color-success-700); border-color: oklch(58% 0.14 152 / 0.25); }
    .up-ctype--pilot { background: var(--color-warning-50); color: var(--color-warning-700); border-color: oklch(75% 0.13 80 / 0.3); }
    .up-ctype--admin { background: var(--color-bg-3); color: var(--color-text-secondary); border-color: var(--color-border-default); }
    .up-ctype--none { background: var(--color-bg-3); color: var(--color-text-tertiary); border-color: var(--color-border-subtle); font-weight: 500; }

    /* Authorizing-type badges */
    .up-auth { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; }
    .up-auth--admin { color: var(--color-primary-700); font-weight: 600; }
    .up-auth--normal { color: var(--color-text-tertiary); }
    .up-auth--locked { color: var(--color-error-700); font-weight: 600; }
    .up-auth--locked > svg { flex: none; }

    /* Expanded device row: the colSpan cell holds a nested .tds-table.
       The DS hover rule (.tds-table tbody tr:hover td) isn't scoped with a
       child combinator, so hovering the inner table also matches THIS outer
       expansion row and floods its whole cell. Pin its background so only the
       inner table's own rows show per-row hover. */
    .tds-table tbody tr.device-expansion-row:hover > td { background: var(--color-bg-1); }

    /* Activity */
    .up-activity { padding: 6px 0; }
    .up-actgroup { padding: 12px 20px; border-bottom: 1px solid var(--color-border-subtle); }
    .up-actgroup:last-child { border-bottom: 0; }
    .up-actgroup__day { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-tertiary); margin-bottom: 12px; }
    .up-actgroup__list { display: flex; flex-direction: column; gap: 14px; }
    .up-actrow { display: grid; grid-template-columns: 28px 52px 1fr; gap: 10px; align-items: flex-start; }
    .up-actrow__dot { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; }
    .up-actrow__dot--success { background: var(--color-success-50); color: var(--color-success-700); border: 1px solid oklch(58% 0.14 152 / 0.25); }
    .up-actrow__dot--info    { background: var(--color-info-50);    color: var(--color-info-700);    border: 1px solid oklch(60% 0.14 230 / 0.25); }
    .up-actrow__dot--warning { background: var(--color-warning-50); color: var(--color-warning-700); border: 1px solid oklch(75% 0.13 80 / 0.3); }
    .up-actrow__time { font: 500 11.5px/1.4 var(--font-family-mono); color: var(--color-text-tertiary); padding-top: 5px; font-variant-numeric: tabular-nums; }
    .up-actrow__main { min-width: 0; padding-top: 2px; }
    .up-actrow__title { font-size: 13.5px; font-weight: 500; color: var(--color-text-primary); line-height: 1.45; }
    .up-actrow__sub { font-size: 12px; color: var(--color-text-tertiary); margin-top: 3px; line-height: 1.45; }

    /* Help */
    .up-help-search { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); margin-bottom: 20px; }
    .up-help-search > svg { color: var(--color-text-tertiary); flex: none; }
    .up-help-search input { flex: 1; border: 0; outline: 0; background: transparent; font: 14.5px var(--font-family-sans); color: var(--color-text-primary); }
    .up-help-search__kbd { font: 500 11px var(--font-family-mono); padding: 4px 8px; border-radius: 5px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); color: var(--color-text-tertiary); cursor: pointer; }
    .up-help-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    @media (max-width: 720px) { .up-help-grid { grid-template-columns: 1fr 1fr; } }
    .up-helpcat { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 14px 16px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; cursor: pointer; transition: all var(--duration-fast); text-align: left; font-family: inherit; }
    .up-helpcat:hover { border-color: var(--color-border-strong); background: var(--color-bg-hover); transform: translateY(-1px); }
    .up-helpcat__icon { width: 32px; height: 32px; border-radius: 8px; background: var(--color-primary-50); color: var(--color-primary-700); display: grid; place-items: center; }
    .up-helpcat__name { font-size: 13.5px; font-weight: 600; color: var(--color-text-primary); }
    .up-helpcat__n { font-size: 11.5px; color: var(--color-text-tertiary); }

    .up-faq { border-bottom: 1px solid var(--color-border-subtle); }
    .up-faq:last-child { border-bottom: 0; }
    .up-faq summary { display: flex; gap: 10px; align-items: center; padding: 13px 20px; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--color-text-primary); list-style: none; }
    .up-faq summary::-webkit-details-marker { display: none; }
    .up-faq summary > svg { color: var(--color-text-tertiary); transition: transform var(--duration-fast); flex: none; }
    .up-faq[open] summary > svg { transform: rotate(90deg); }
    .up-faq summary:hover { background: var(--color-bg-hover); }
    .up-faq__a { padding: 0 20px 14px 42px; font-size: 13px; color: var(--color-text-secondary); line-height: 1.55; }
    .up-help-cta { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 20px 12px; }

    /* Feedback */
    .up-fb-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
    @media (max-width: 880px) { .up-fb-grid { grid-template-columns: 1fr; } }
    .up-fb-kind { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px 20px; }
    .up-fb-kind__btn { display: flex; gap: 10px; align-items: flex-start; padding: 12px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 10px; cursor: pointer; transition: all var(--duration-fast); text-align: left; font-family: inherit; color: var(--color-text-primary); }
    .up-fb-kind__btn:hover { background: var(--color-bg-hover); }
    .up-fb-kind__btn.is-on { border-color: var(--color-primary-700); background: var(--color-primary-50); box-shadow: 0 0 0 3px oklch(40% 0.14 262 / 0.08); }
    .up-fb-kind__btn > svg { color: var(--color-text-tertiary); margin-top: 2px; flex: none; }
    .up-fb-kind__btn.is-on > svg { color: var(--color-primary-700); }
    .up-fb-kind__lbl { font-size: 13.5px; font-weight: 600; }
    .up-fb-kind__sub { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; }
    .up-card .tds-field { padding: 0 20px 14px; }
    .up-fb-share { display: flex; gap: 12px; padding: 12px 20px; background: var(--color-bg-3); border-top: 1px solid var(--color-border-subtle); cursor: pointer; align-items: flex-start; }
    .up-fb-share input { margin-top: 3px; flex: none; }
    .up-fb-share > span { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; line-height: 1.5; }
    .up-fb-share strong { font-weight: 600; color: var(--color-text-primary); }
    .up-fb-share small { font-size: 11.5px; color: var(--color-text-tertiary); }
    .up-fb-share code { font: 500 11.5px var(--font-family-mono); background: var(--color-bg-2); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--color-border-subtle); }
    .up-fb-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--color-border-subtle); }

    /* ─── Settings ───────────────────────────────────────── */
    .settings-tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--color-border-default); margin-bottom: 20px; padding: 0 4px; }
    .settings-tab { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 0; background: transparent; font-family: inherit; font-size: 13.5px; font-weight: 500; color: var(--color-text-secondary); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color var(--duration-fast), border-color var(--duration-fast); }
    .settings-tab:hover { color: var(--color-text-primary); }
    .settings-tab.is-on { color: var(--color-text-primary); border-bottom-color: var(--color-primary-700); }
    .settings-tab__count { background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); color: var(--color-text-tertiary); font-size: 11px; padding: 1px 6px; border-radius: 10px; font-variant-numeric: tabular-nums; }
    .settings-tab.is-on .settings-tab__count { background: var(--color-primary-50); border-color: oklch(60% 0.14 262 / 0.25); color: var(--color-primary-700); }
    .settings-tabs__spacer { flex: 1; }

    /* Roles master/detail */
    .roles-grid { display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: start; }
    .roles-list { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); overflow: hidden; position: sticky; top: 16px; }
    .roles-list__head { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--color-border-subtle); }
    .roles-list__head .tds-input { flex: 1 1 0; min-width: 0; }
    .roles-list__head .tds-input__el { min-width: 0; width: 100%; }
    .roles-list__head .tds-btn { flex: none; }
    .roles-list__hint { display: flex; gap: 6px; align-items: flex-start; padding: 8px 14px 10px; font-size: 11.5px; color: var(--color-text-tertiary); border-bottom: 1px solid var(--color-border-subtle); background: var(--color-bg-3); line-height: 1.45; }
    .roles-list__hint svg { flex: none; margin-top: 1px; color: var(--color-info-700); }
    .roles-list__items { display: flex; flex-direction: column; max-height: calc(100vh - 240px); overflow: auto; }

    .role-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; background: transparent; text-align: left; cursor: pointer; border-bottom: 1px solid var(--color-border-subtle); width: 100%; font-family: inherit; }
    .role-item:last-child { border-bottom: 0; }
    .role-item:hover { background: var(--color-bg-hover); }
    .role-item.is-on { background: var(--color-primary-50); }
    .role-item.is-on::before { content: ''; position: absolute; }
    .role-item__icon { width: 30px; height: 30px; border-radius: 8px; background: var(--color-bg-3); display: grid; place-items: center; color: var(--color-text-secondary); flex: none; }
    .role-item.is-on .role-item__icon { background: var(--color-primary-700); color: #fff; }
    .role-item__main { flex: 1; min-width: 0; }
    .role-item__name { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--color-text-primary); }
    .role-item__meta { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
    .role-item__meta .dot { opacity: 0.5; }
    .role-item__count { font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 600; color: var(--color-text-secondary); background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); padding: 2px 8px; border-radius: 10px; }
    .role-item.is-on .role-item__count { background: #fff; border-color: oklch(60% 0.14 262 / 0.25); color: var(--color-primary-700); }

    .role-editor { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); overflow: hidden; }
    .role-editor__head { display: flex; align-items: flex-start; gap: 16px; padding: 18px 22px; border-bottom: 1px solid var(--color-border-subtle); background: var(--color-bg-2); }
    .role-editor__title-wrap { flex: 1; min-width: 0; }
    .role-editor__title-input { background: transparent; border: 1px solid transparent; padding: 4px 8px; margin-left: -8px; font-family: inherit; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: var(--color-text-primary); outline: none; border-radius: 6px; width: 100%; max-width: 400px; }
    .role-editor__title-input:hover:not(:disabled) { background: var(--color-bg-hover); }
    .role-editor__title-input:focus { border-color: var(--color-border-focus); background: var(--color-bg-2); box-shadow: var(--shadow-focus); }
    .role-editor__title-input:disabled { color: var(--color-text-primary); cursor: not-allowed; }
    .role-editor__sub { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-tertiary); margin-top: 6px; flex-wrap: wrap; }
    .role-editor__sub .dot { opacity: 0.5; }
    .role-editor__actions { display: flex; gap: 6px; align-items: center; }
    .role-editor__body { padding: 18px 22px 24px; display: flex; flex-direction: column; gap: 16px; }

    /* Contract scope rows */
    .scope-mode { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .scope-mode__btn { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1px solid var(--color-border-default); border-radius: 10px; background: var(--color-bg-2); cursor: pointer; text-align: left; font-family: inherit; transition: all var(--duration-fast); color: var(--color-text-primary); }
    .scope-mode__btn:hover { background: var(--color-bg-hover); }
    .scope-mode__btn.is-on { border-color: var(--color-primary-700); background: var(--color-primary-50); box-shadow: 0 0 0 3px oklch(40% 0.14 262 / 0.08); }
    .scope-mode__btn > svg { color: var(--color-text-tertiary); margin-top: 2px; flex: none; }
    .scope-mode__btn.is-on > svg { color: var(--color-primary-700); }
    .scope-mode__name { font-size: 13.5px; font-weight: 600; }
    .scope-mode__desc { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; line-height: 1.4; }

    .scope-summary { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 8px; font-size: 12.5px; color: var(--color-text-secondary); margin-bottom: 12px; font-variant-numeric: tabular-nums; }
    .scope-summary svg { color: var(--color-text-tertiary); flex: none; }

    .contract-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .contract-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--color-border-default); border-radius: 10px; background: var(--color-bg-2); cursor: pointer; transition: all var(--duration-fast); }
    .contract-row:hover { background: var(--color-bg-hover); }
    .contract-row.is-on { border-color: var(--color-primary-700); background: var(--color-primary-50); box-shadow: 0 0 0 3px oklch(40% 0.14 262 / 0.06); }
    .contract-row[data-mode="deny"].is-on { border-color: var(--color-error-500); background: var(--color-error-50); box-shadow: 0 0 0 3px oklch(60% 0.18 25 / 0.06); }
    .contract-row[data-mode="deny"].is-on .tg.is-on { background: var(--color-error-500); border-color: var(--color-error-500); }
    .contract-row__name { font-size: 13.5px; font-weight: 600; color: var(--color-text-primary); }
    .contract-row__desc { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; display: flex; align-items: center; flex-wrap: wrap; }
    .contract-row__eff { font-weight: 600; }
    .contract-row__eff--allow { color: var(--color-success-700); }
    .contract-row__eff--deny  { color: var(--color-error-700); }

    .role-item__mode { font: 600 9.5px var(--font-family-mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; margin-left: 4px; }

    /* ─── Customer Role Definitions (contract tabs + tag + radio) ─────── */
    .crd-tabs { display: flex; align-items: center; gap: 4px; padding: 0; border-bottom: 1px solid var(--color-border-default); margin-bottom: 4px; }
    .crd-tab { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 0; background: transparent; font-family: inherit; font-size: 13.5px; font-weight: 500; color: var(--color-text-secondary); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color var(--duration-fast), border-color var(--duration-fast); }
    .crd-tab:hover { color: var(--color-text-primary); }
    .crd-tab.is-on { color: var(--color-text-primary); border-bottom-color: var(--color-primary-700); }
    .crd-tab__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-text-tertiary); flex: none; box-shadow: 0 0 0 2px var(--color-bg-1); }
    .crd-tab__dot--isv      { background: var(--color-accent-700); }
    .crd-tab__dot--iso      { background: var(--color-info-700); }
    .crd-tab__dot--acquirer { background: var(--color-success-700); }
    .crd-tab__dot--payfac   { background: var(--color-warning-700); }
    .crd-tab__dot--merchant { background: oklch(48% 0.13 190); }
    .crd-tab__dot--admin    { background: oklch(38% 0.05 280); }
    .crd-tab__dot--generic  { background: var(--color-text-tertiary); }
    .crd-tab__label { letter-spacing: -0.005em; }
    .crd-tab__n { background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); color: var(--color-text-tertiary); font-size: 11px; padding: 1px 6px; border-radius: 10px; font-variant-numeric: tabular-nums; }
    .crd-tab.is-on .crd-tab__n { background: var(--color-primary-50); border-color: oklch(60% 0.14 262 / 0.25); color: var(--color-primary-700); }
    .crd-tabs__spacer { flex: 1; }
    .crd-tabs__hint { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--color-text-tertiary); padding-right: 4px; }
    .crd-tabs__hint svg { color: var(--color-info-700); }

    .crd-contract-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 600 11.5px var(--font-family-sans); letter-spacing: 0.02em; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); color: var(--color-text-secondary); }
    .crd-contract-tag--isv      { background: oklch(96% 0.04 265 / 0.65); color: var(--color-accent-700); border-color: oklch(70% 0.12 265 / 0.3); }
    .crd-contract-tag--iso      { background: oklch(96% 0.03 230 / 0.65); color: var(--color-info-700); border-color: oklch(70% 0.12 230 / 0.3); }
    .crd-contract-tag--acquirer { background: oklch(96% 0.03 152 / 0.65); color: var(--color-success-700); border-color: oklch(70% 0.12 152 / 0.3); }
    .crd-contract-tag--payfac   { background: oklch(96.5% 0.04 80 / 0.65); color: var(--color-warning-700); border-color: oklch(75% 0.13 80 / 0.3); }
    .crd-contract-tag--merchant { background: oklch(96% 0.04 190 / 0.65); color: oklch(45% 0.13 190); border-color: oklch(65% 0.13 190 / 0.3); }
    .crd-contract-tag--admin    { background: oklch(94% 0.02 280 / 0.7); color: oklch(38% 0.05 280); border-color: oklch(55% 0.05 280 / 0.3); }

    /* Single-select radio cards for contract type */
    .contract-radio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .contract-radio-grid--sm { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .contract-radio { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--color-border-default); border-radius: 10px; background: var(--color-bg-2); cursor: pointer; text-align: left; font-family: inherit; transition: all var(--duration-fast); }
    .contract-radio:hover { background: var(--color-bg-hover); }
    .contract-radio.is-on { border-color: var(--color-primary-700); background: var(--color-primary-50); box-shadow: 0 0 0 3px oklch(40% 0.14 262 / 0.08); }
    .contract-radio--sm { padding: 10px 12px; gap: 10px; }
    .contract-radio--sm.is-on { background: var(--color-primary-50); }
    .contract-radio__name { font-size: 13.5px; font-weight: 600; color: var(--color-text-primary); letter-spacing: -0.005em; }
    .contract-radio__desc { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; line-height: 1.4; }
    .contract-radio__pick { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--color-primary-700); }
    .contract-radio__ring { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--color-border-strong); }
    .contract-radio.is-on .contract-radio__pick { background: var(--color-primary-700); color: #fff; }
    .pick-card__icon--generic { background: var(--color-bg-3); color: var(--color-text-tertiary); border: 1px dashed var(--color-border-strong); }

    /* Role list contract chip + builtin/private tags + group headers */
    .role-item__contract { font: 600 9.5px var(--font-family-mono); letter-spacing: 0.04em; padding: 1px 5px; border-radius: 3px; border: 1px solid; }
    .role-item__contract--isv      { color: var(--color-accent-700);  background: oklch(96% 0.04 265 / 0.6); border-color: oklch(70% 0.12 265 / 0.25); }
    .role-item__contract--iso      { color: var(--color-info-700);    background: oklch(96% 0.03 230 / 0.6); border-color: oklch(70% 0.12 230 / 0.25); }
    .role-item__contract--acquirer { color: var(--color-success-700); background: oklch(96% 0.03 152 / 0.6); border-color: oklch(70% 0.12 152 / 0.25); }
    .role-item__contract--payfac   { color: var(--color-warning-700); background: oklch(96.5% 0.04 80 / 0.6); border-color: oklch(75% 0.13 80 / 0.25); }
    .role-item__contract--merchant { color: oklch(45% 0.13 190); background: oklch(96% 0.04 190 / 0.6); border-color: oklch(65% 0.13 190 / 0.25); }
    .role-item__contract--admin    { color: oklch(38% 0.05 280); background: oklch(94% 0.02 280 / 0.7); border-color: oklch(55% 0.05 280 / 0.25); }
    .role-item__contract--generic  { color: var(--color-text-tertiary); background: var(--color-bg-3); border-color: var(--color-border-default); }
    .role-item__builtin, .role-item__private, .role-editor__tag { font: 600 9px var(--font-family-mono); letter-spacing: 0.08em; padding: 1px 5px; border-radius: 3px; background: var(--color-bg-3); color: var(--color-text-tertiary); border: 1px solid var(--color-border-subtle); }
    .role-item__private { color: oklch(48% 0.13 190); background: oklch(96% 0.04 190 / 0.5); border-color: oklch(65% 0.13 190 / 0.25); }
    .role-editor__tag { color: var(--color-text-secondary); }

    .roles-list__group { padding: 12px 14px 6px; background: var(--color-bg-3); border-bottom: 1px solid var(--color-border-subtle); border-top: 1px solid var(--color-border-subtle); }
    .roles-list__group:first-child { border-top: 0; }
    .roles-list__group-title { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-secondary); }
    .roles-list__group-sub { font-size: 11px; color: var(--color-text-tertiary); margin-top: 3px; line-height: 1.4; }
    .roles-list__group[data-kind="generic"] .roles-list__group-title { color: var(--color-info-700); }

    /* ─── Platform Users (admin-users.jsx) ────────────────────────────── */
    .pu-grid { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .pu-list { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); overflow: hidden; position: sticky; top: 16px; }
    .pu-list__head { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--color-border-subtle); }
    .pu-list__head .tds-input { flex: 1 1 0; min-width: 0; }
    .pu-list__items { display: flex; flex-direction: column; max-height: calc(100vh - 240px); overflow: auto; }
    .pu-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; background: transparent; text-align: left; cursor: pointer; border-bottom: 1px solid var(--color-border-subtle); width: 100%; font-family: inherit; }
    .pu-row:last-child { border-bottom: 0; }
    .pu-row:hover { background: var(--color-bg-hover); }
    .pu-row.is-on { background: var(--color-primary-50); }
    .pu-row__avatar { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; background: linear-gradient(135deg, var(--color-primary-500), var(--color-accent-600)); color: #fff; font: 600 12px var(--font-family-sans); letter-spacing: -0.01em; }
    .pu-row__avatar[data-locked="true"] { background: linear-gradient(135deg, oklch(70% 0.13 25), oklch(58% 0.16 25)); }
    .pu-row__main { flex: 1; min-width: 0; }
    .pu-row__name { font-size: 13.5px; font-weight: 600; color: var(--color-text-primary); display: flex; align-items: center; gap: 6px; }
    .pu-row__login { font: 500 11.5px var(--font-family-mono); color: var(--color-text-tertiary); margin-top: 2px; }
    .pu-row__meta { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 3px; display: flex; gap: 6px; align-items: center; }
    .pu-status { font: 600 9.5px var(--font-family-mono); letter-spacing: 0.06em; padding: 1px 5px; border-radius: 3px; border: 1px solid; }
    .pu-status--active { color: var(--color-success-700); background: var(--color-success-50); border-color: oklch(58% 0.14 152 / 0.25); }
    .pu-status--locked { color: var(--color-error-700);   background: var(--color-error-50);   border-color: oklch(70% 0.16 25 / 0.25); }
    .pu-detail { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); overflow: hidden; }
    .pu-detail__head { display: flex; align-items: flex-start; gap: 16px; padding: 18px 22px; border-bottom: 1px solid var(--color-border-subtle); }
    .pu-detail__avatar { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; flex: none; background: linear-gradient(135deg, var(--color-primary-500), var(--color-accent-600)); color: #fff; font: 600 20px var(--font-family-sans); letter-spacing: -0.02em; }
    .pu-detail__avatar[data-locked="true"] { background: linear-gradient(135deg, oklch(70% 0.13 25), oklch(58% 0.16 25)); }
    .pu-detail__title-wrap { flex: 1; min-width: 0; }
    .pu-detail__title { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pu-detail__sub { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--color-text-tertiary); margin-top: 6px; }
    .pu-detail__sub span { display: inline-flex; align-items: center; gap: 6px; }
    .pu-detail__actions { display: flex; gap: 6px; align-items: center; }
    .pu-detail__body { padding: 18px 22px 24px; display: flex; flex-direction: column; gap: 16px; }

    .pu-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .pu-stat { padding: 12px 14px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 10px; }
    .pu-stat__lbl { font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-tertiary); }
    .pu-stat__val { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .pu-stat__sub { font-size: 11px; color: var(--color-text-tertiary); margin-top: 2px; }
    .pu-stat--danger .pu-stat__val { color: var(--color-error-700); }
    .pu-stat--warn .pu-stat__val { color: var(--color-warning-700); }
    .pu-stat--ok .pu-stat__val { color: var(--color-success-700); }

    .pu-roles { display: flex; flex-direction: column; gap: 6px; }
    .pu-role { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 8px; }
    .pu-role__main { flex: 1; min-width: 0; }
    .pu-role__name { font-size: 13px; font-weight: 600; color: var(--color-text-primary); }
    .pu-role__desc { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; }

    .pu-history { font-size: 12.5px; }
    .pu-history__row { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--color-border-subtle); align-items: center; }
    .pu-history__row:last-child { border-bottom: 0; }
    .pu-history__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-text-tertiary); margin: 0 auto; }
    .pu-history__row:first-child .pu-history__dot { background: var(--color-success-700); }
    .pu-history__date { font: 500 12.5px var(--font-family-mono); color: var(--color-text-primary); }
    .pu-history__age { font-size: 11.5px; color: var(--color-text-tertiary); font-variant-numeric: tabular-nums; }

    .pu-policy { display: flex; flex-direction: column; gap: 0; }
    .pu-policy__row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--color-border-subtle); }
    .pu-policy__row:last-child { border-bottom: 0; }
    .pu-policy__icon { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--color-bg-3); color: var(--color-text-secondary); flex: none; }
    .pu-policy__main { flex: 1; min-width: 0; }
    .pu-policy__name { font-size: 13px; font-weight: 600; color: var(--color-text-primary); }
    .pu-policy__desc { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; line-height: 1.4; }
    .pu-policy__val { font: 600 12px var(--font-family-mono); color: var(--color-primary-700); background: var(--color-primary-50); padding: 4px 10px; border-radius: 6px; border: 1px solid oklch(60% 0.14 262 / 0.2); white-space: nowrap; }

    .pu-locked-banner { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: var(--color-error-50); border: 1px solid oklch(70% 0.16 25 / 0.3); border-radius: 10px; }
    .pu-locked-banner svg { color: var(--color-error-700); flex: none; margin-top: 1px; }
    .pu-locked-banner__title { font-size: 13px; font-weight: 600; color: var(--color-error-700); }
    .pu-locked-banner__sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; line-height: 1.5; }

    /* PENDING state additions for Platform Users page */
    .pu-status--pending { color: var(--color-warning-700); background: var(--color-warning-50); border-color: oklch(75% 0.13 80 / 0.3); }
    .pu-row.is-pending .pu-row__avatar { background: linear-gradient(135deg, oklch(78% 0.1 80), oklch(64% 0.14 80)); }
    .pu-row__avatar[data-pending="true"] { background: linear-gradient(135deg, oklch(78% 0.1 80), oklch(64% 0.14 80)); }
    .pu-detail__avatar[data-pending="true"] { background: linear-gradient(135deg, oklch(78% 0.1 80), oklch(64% 0.14 80)); }
    .pu-row__actions { display: flex; gap: 2px; flex: none; opacity: 0; transition: opacity var(--duration-fast); }
    .pu-row:hover .pu-row__actions, .pu-row.is-on .pu-row__actions { opacity: 1; }

    /* ─── Onboarding (invite-link landing) ─────────────────────────────── */
    .ob-shell { position: fixed; inset: 0; z-index: 8500; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--color-bg-3), var(--color-bg-1) 60%); overflow: auto; }
    .ob-topbar { display: flex; align-items: center; gap: 14px; padding: 16px 28px; border-bottom: 1px solid var(--color-border-subtle); background: oklch(100% 0 0 / 0.7); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 1; }
    [data-theme="dark"] .ob-topbar { background: oklch(20% 0.01 262 / 0.7); }
    .ob-brand { display: flex; align-items: center; gap: 12px; }
    .ob-brand__logo { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: none; }
    .ob-brand__logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .ob-brand__name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .ob-brand__name small { display: block; font-size: 10.5px; color: var(--color-text-tertiary); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }
    .ob-topbar__spacer { flex: 1; }
    .ob-exit { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: transparent; border: 1px solid var(--color-border-default); color: var(--color-text-secondary); font: 500 12.5px var(--font-family-sans); cursor: pointer; font-family: inherit; }
    .ob-exit:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }

    .ob-main { flex: 1; display: grid; place-items: center; padding: 48px 32px; }
    .ob-grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; width: min(880px, 100%); align-items: start; }
    @media (max-width: 800px) { .ob-grid { grid-template-columns: 1fr; } }

    .ob-card { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 16px; box-shadow: var(--shadow-3); padding: 32px 32px 28px; position: relative; }
    .ob-card--narrow { width: min(440px, 100%); padding: 36px 32px 30px; }
    .ob-card--wide { width: min(560px, 100%); padding: 36px 32px 30px; }
    .ob-card--centered { text-align: center; }
    .ob-card--err { width: min(460px, 100%); padding: 40px 32px; text-align: center; border-color: oklch(70% 0.16 25 / 0.4); }
    .ob-card__eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); margin-bottom: 6px; }
    .ob-card__title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 6px; }
    .ob-card__sub { font-size: 13.5px; color: var(--color-text-secondary); margin: 0 0 22px; line-height: 1.55; }
    .ob-card__icon { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; margin: 0 auto 18px; }
    .ob-card__icon--ok { background: var(--color-success-50); color: var(--color-success-700); border: 1px solid oklch(58% 0.14 152 / 0.3); }
    .ob-card__icon--err { background: var(--color-error-50); color: var(--color-error-700); border: 1px solid oklch(70% 0.16 25 / 0.3); }
    .ob-code { font: 500 12px var(--font-family-mono); background: var(--color-bg-3); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--color-border-subtle); }
    .ob-back { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 6px; background: transparent; border: 0; color: var(--color-text-secondary); font: 500 12.5px var(--font-family-sans); cursor: pointer; font-family: inherit; margin: -8px 0 14px -10px; }
    .ob-back:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }
    .ob-error { font-size: 12.5px; color: var(--color-error-700); padding: 8px 10px; background: var(--color-error-50); border: 1px solid oklch(70% 0.16 25 / 0.25); border-radius: 6px; }

    /* Account preview */
    .ob-account { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 12px; margin-bottom: 14px; }
    .ob-account--anon { background: var(--color-bg-2); border-style: dashed; }
    .ob-account__avatar { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--color-primary-500), var(--color-accent-600)); color: #fff; display: grid; place-items: center; font: 600 16px var(--font-family-sans); letter-spacing: -0.02em; flex: none; }
    .ob-account__avatar--anon { background: var(--color-bg-3); color: var(--color-text-tertiary); border: 1px dashed var(--color-border-strong); }
    .ob-account__main { flex: 1; min-width: 0; }
    .ob-account__label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-tertiary); }
    .ob-account__name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em; margin-top: 2px; }
    .ob-account__email { font: 500 12px var(--font-family-mono); color: var(--color-text-tertiary); margin-top: 2px; }
    .ob-account__chip { font: 600 9.5px var(--font-family-mono); letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px; border: 1px solid; flex: none; }
    .ob-account__chip--ok  { color: var(--color-success-700); background: var(--color-success-50); border-color: oklch(58% 0.14 152 / 0.25); }
    .ob-account__chip--new { color: var(--color-info-700);    background: var(--color-info-50);    border-color: oklch(60% 0.14 230 / 0.25); }

    .ob-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .ob-actions--row { flex-direction: row; justify-content: flex-end; }
    .ob-actions--center { justify-content: center; }
    .ob-actions .tds-btn { justify-content: center; }
    .ob-actions:not(.ob-actions--row) .tds-btn { width: 100%; padding-top: 10px; padding-bottom: 10px; }
    .ob-meta { display: flex; align-items: center; gap: 6px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--color-border-subtle); font-size: 11.5px; color: var(--color-text-tertiary); }
    .ob-meta svg { color: var(--color-text-tertiary); flex: none; }

    /* Confirm — compact entity row */
    .ob-entrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 12px; }
    .ob-entrow__logo { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, oklch(45% 0.18 262), oklch(38% 0.05 280)); color: #fff; display: grid; place-items: center; font: 700 11.5px var(--font-family-sans); letter-spacing: 0.04em; flex: none; }
    .ob-entrow__main { flex: 1; min-width: 0; }
    .ob-entrow__name { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
    .ob-entrow__sub { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }
    .ob-entrow__sub strong { color: var(--color-text-secondary); font-weight: 600; }

    /* Divider with caption */
    .ob-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 14px; color: var(--color-text-tertiary); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; }
    .ob-divider::before, .ob-divider::after { content: ''; flex: 1; height: 1px; background: var(--color-border-subtle); }

    /* Confirm — emphasized account card */
    .ob-account--lg { padding: 18px 18px; margin-bottom: 0; }
    .ob-account__avatar--lg { width: 52px; height: 52px; border-radius: 14px; font-size: 17px; }

    /* Radio cards (Register · Email step) */
    .ob-radio-card { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; cursor: pointer; transition: border-color 0.15s, background 0.15s, box-shadow 0.15s; }
    .ob-radio-card:hover { border-color: var(--color-border-strong); }
    .ob-radio-card.is-on { border-color: var(--color-primary-500); background: var(--color-primary-50); box-shadow: 0 0 0 3px oklch(60% 0.16 262 / 0.10); }
    .ob-radio-card > input[type="radio"] { margin-top: 3px; accent-color: var(--color-primary-600); width: 16px; height: 16px; flex: none; cursor: pointer; }
    .ob-radio-card__main { flex: 1; min-width: 0; }
    .ob-radio-card__title { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; color: var(--color-text-primary); display: flex; align-items: center; }
    .ob-radio-card__sub { font-size: 12.5px; color: var(--color-text-secondary); margin-top: 4px; line-height: 1.5; }
    .ob-radio-card__form { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--color-border-subtle); display: flex; flex-direction: column; gap: 12px; }

    /* Verified state pill (after code passes) */
    .ob-verified { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--color-success-50); border: 1px solid oklch(58% 0.14 152 / 0.3); border-radius: 10px; font-size: 12.5px; color: var(--color-success-700); }
    .ob-verified svg { color: var(--color-success-700); flex: none; }
    .ob-verified > span { flex: 1; color: var(--color-text-primary); }

    .ob-linkbtn { background: transparent; border: 0; padding: 6px 0; color: var(--color-text-secondary); font: 500 12px var(--font-family-sans); cursor: pointer; }
    .ob-linkbtn:hover { color: var(--color-text-primary); text-decoration: underline; }

    /* Entity side card */
    .ob-side { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 16px; padding: 22px; box-shadow: var(--shadow-2); }
    .ob-side__brand { display: flex; align-items: center; gap: 12px; }
    .ob-side__brandlogo { width: 44px; height: 44px; border-radius: 11px; background: linear-gradient(135deg, oklch(45% 0.18 262), oklch(38% 0.05 280)); color: #fff; display: grid; place-items: center; font: 700 13px var(--font-family-sans); letter-spacing: 0.04em; flex: none; box-shadow: var(--shadow-cta); }
    .ob-side__brandname { font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em; }
    .ob-side__brandsub { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; }
    .ob-side__desc { font-size: 12.5px; color: var(--color-text-secondary); margin: 14px 0 0; line-height: 1.55; }
    .ob-side__sep { height: 1px; background: var(--color-border-subtle); margin: 16px 0; }
    .ob-side__kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .ob-side__kvlbl { font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-tertiary); }
    .ob-side__kvval { font-size: 12.5px; color: var(--color-text-primary); margin-top: 2px; font-weight: 500; }
    .ob-side__roles { display: flex; flex-direction: column; gap: 6px; }
    .ob-side__role { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--color-text-primary); }
    .ob-side__role svg { color: var(--color-text-tertiary); flex: none; }

    /* Stepper */
    .ob-stepper { display: flex; align-items: center; margin: 18px 0 22px; }
    .ob-stepper__node { display: flex; align-items: center; gap: 8px; flex: none; color: var(--color-text-tertiary); }
    .ob-stepper__node.is-done, .ob-stepper__node.is-on { color: var(--color-text-primary); }
    .ob-stepper__dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--color-bg-3); border: 1px solid var(--color-border-default); color: var(--color-text-tertiary); font: 600 11px var(--font-family-sans); flex: none; transition: all var(--duration-fast); }
    .ob-stepper__node.is-on .ob-stepper__dot { background: var(--color-primary-700); border-color: var(--color-primary-700); color: #fff; box-shadow: 0 0 0 3px oklch(40% 0.14 262 / 0.12); }
    .ob-stepper__node.is-done .ob-stepper__dot { background: var(--color-success-50); border-color: oklch(58% 0.14 152 / 0.4); color: var(--color-success-700); }
    .ob-stepper__lbl { font-size: 12px; font-weight: 500; }
    .ob-stepper__node:not(.is-on):not(.is-done) .ob-stepper__lbl { display: none; }
    .ob-stepper__bar { flex: 1; height: 1px; background: var(--color-border-default); margin: 0 10px; min-width: 24px; }
    .ob-stepper__bar.is-done { background: var(--color-success-500); opacity: 0.5; }
    .ob-step-body { margin: 18px 0 4px; }

    /* Password checklist */
    .ob-checklist { list-style: none; padding: 12px 14px; margin: 4px 0 0; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 8px; display: flex; flex-direction: column; gap: 6px; }
    .ob-checklist__row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-text-tertiary); }
    .ob-checklist__row.is-on { color: var(--color-success-700); }
    .ob-checklist__row svg { flex: none; }

    /* Confirm — perms preview */
    .ob-perms { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--color-border-subtle); }
    .ob-perms__lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-tertiary); margin-bottom: 10px; }
    .ob-perm-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 10px; margin-bottom: 8px; }
    .ob-perm-card:last-child { margin-bottom: 0; }
    .ob-perm-card__icon { width: 32px; height: 32px; border-radius: 8px; background: oklch(94% 0.02 280 / 0.7); color: oklch(38% 0.05 280); display: grid; place-items: center; flex: none; border: 1px solid oklch(55% 0.05 280 / 0.25); }
    .ob-perm-card__name { font-size: 13px; font-weight: 600; color: var(--color-text-primary); }
    .ob-perm-card__desc { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; line-height: 1.4; }
    .ob-perm-card__meta { font-size: 11px; color: var(--color-text-tertiary); margin-top: 4px; font-variant-numeric: tabular-nums; }

    /* Confetti (welcome screen) */
    .ob-confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 16px; }
    .ob-confetti span { position: absolute; top: 0; left: 50%; width: 7px; height: 11px; border-radius: 2px; animation: obFall 1.4s cubic-bezier(.35,.65,.55,1) calc(var(--i) * 60ms) forwards; opacity: 0; }
    .ob-confetti span:nth-child(3n)   { background: var(--color-primary-500); }
    .ob-confetti span:nth-child(3n+1) { background: var(--color-accent-500, oklch(60% 0.2 25)); }
    .ob-confetti span:nth-child(3n+2) { background: var(--color-success-500); }
    .ob-confetti span:nth-child(2n)   { width: 5px; height: 5px; border-radius: 50%; }
    @keyframes obFall {
      0%   { transform: translate(-50%, -8px) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--x, 0px) * 1px + (var(--i) - 9) * 18px), 420px) rotate(720deg); opacity: 0; }
    }
    .role-item__mode[data-mode="allow"] { color: var(--color-success-700); background: var(--color-success-50); }
    .role-item__mode[data-mode="deny"]  { color: var(--color-error-700);   background: var(--color-error-50); }

    /* Permissions */
    .perm-group { border-bottom: 1px solid var(--color-border-subtle); }
    .perm-group:last-child { border-bottom: 0; }
    .perm-group__head { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--color-bg-3); border-bottom: 1px solid var(--color-border-subtle); }
    .perm-group__name { font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--color-text-secondary); }
    .perm-group__meta { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .perm-group__toggle { background: transparent; border: 0; color: var(--color-primary-500); font: 500 12px var(--font-family-sans); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .perm-group__toggle:hover { background: var(--color-bg-hover); }
    .perm-group__items { display: flex; flex-direction: column; }
    .perm-row { display: flex; align-items: flex-start; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--color-border-subtle); cursor: pointer; transition: background var(--duration-fast); }
    .perm-row:last-child { border-bottom: 0; }
    .perm-row:hover { background: var(--color-bg-hover); }
    .perm-row.is-on { background: oklch(98% 0.01 262); }
    .perm-row__main { flex: 1; min-width: 0; }
    .perm-row__name { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; color: var(--color-text-primary); flex-wrap: wrap; }
    .perm-row__id { font: 500 10.5px var(--font-family-mono); color: var(--color-text-tertiary); background: var(--color-bg-3); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--color-border-subtle); }
    .perm-row__desc { font-size: 12px; color: var(--color-text-tertiary); margin-top: 3px; line-height: 1.45; }

    .perm-locked-banner { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--color-warning-50); border-bottom: 1px solid oklch(75% 0.13 80 / 0.25); font-size: 12.5px; color: var(--color-warning-700); }
    .perm-locked-banner svg { flex: none; }

    .perm-row__chips { display: inline-flex; gap: 4px; margin-left: 4px; flex-wrap: wrap; }
    .perm-chip { font: 600 9.5px var(--font-family-mono); letter-spacing: 0.04em; padding: 1px 6px; border-radius: 3px; border: 1px solid currentColor; }
    .perm-chip--isv      { color: var(--color-accent-700);  background: oklch(96% 0.04 265 / 0.6); }
    .perm-chip--iso      { color: var(--color-info-700);    background: oklch(96% 0.03 230 / 0.6); }
    .perm-chip--acquirer { color: var(--color-success-700); background: oklch(96% 0.03 152 / 0.6); }
    .perm-chip--payfac   { color: var(--color-warning-700); background: oklch(96.5% 0.04 80 / 0.6); }
    .perm-chip--merchant { color: oklch(45% 0.13 190); background: oklch(96% 0.04 190 / 0.6); }
    .perm-chip--admin    { color: oklch(38% 0.05 280); background: oklch(94% 0.02 280 / 0.7); }
    .perm-chip--global   { color: var(--color-text-tertiary); background: var(--color-bg-3); border-color: var(--color-border-default); }

    /* Inline "X permissions" preview link in role rows */
    .perm-link { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); font: 500 11.5px var(--font-family-sans); color: var(--color-text-secondary); cursor: pointer; font-family: inherit; transition: all var(--duration-fast); }
    .perm-link:hover { background: var(--color-primary-50); border-color: oklch(60% 0.14 262 / 0.3); color: var(--color-primary-700); }
    .perm-link svg { opacity: 0.65; }
    .perm-link:hover svg { opacity: 1; }

    /* Permissions preview modal — grouped checklist */
    .perm-preview { display: flex; flex-direction: column; gap: 14px; max-height: 60vh; overflow: auto; padding-right: 4px; }
    .perm-preview__group { background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 10px; overflow: hidden; }
    .perm-preview__grouphead { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; background: var(--color-bg-2); border-bottom: 1px solid var(--color-border-subtle); font: 600 11.5px var(--font-family-sans); letter-spacing: -0.005em; color: var(--color-text-primary); }
    .perm-preview__count { font: 500 11px var(--font-family-mono); padding: 1px 7px; border-radius: 999px; background: var(--color-primary-50); color: var(--color-primary-700); font-variant-numeric: tabular-nums; }
    .perm-preview__list { list-style: none; margin: 0; padding: 4px 0; }
    .perm-preview__item { display: flex; gap: 10px; padding: 8px 14px; align-items: flex-start; }
    .perm-preview__item + .perm-preview__item { border-top: 1px dashed var(--color-border-subtle); }
    .perm-preview__check { width: 18px; height: 18px; border-radius: 5px; background: var(--color-success-50); color: var(--color-success-700); display: grid; place-items: center; flex: none; border: 1px solid oklch(58% 0.14 152 / 0.25); margin-top: 1px; }
    .perm-preview__lbl { font-size: 12.5px; font-weight: 500; color: var(--color-text-primary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .perm-preview__id { font: 500 11px var(--font-family-mono); color: var(--color-text-tertiary); background: var(--color-bg-2); border: 1px solid var(--color-border-subtle); padding: 1px 5px; border-radius: 4px; }
    .perm-preview__desc { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 3px; line-height: 1.45; }

    /* Customer detail — roles tab */
    .cust-role-perms { border: 1px solid var(--color-border-default); border-radius: 10px; max-height: 360px; overflow: auto; background: var(--color-bg-2); }
    .cust-role-perms__group { border-bottom: 1px solid var(--color-border-subtle); }
    .cust-role-perms__group:last-child { border-bottom: 0; }
    .cust-role-perms__group summary { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; background: var(--color-bg-3); font-size: 12.5px; font-weight: 600; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.02em; list-style: none; }
    .cust-role-perms__group summary::-webkit-details-marker { display: none; }
    .cust-role-perms__group summary svg { transition: transform var(--duration-fast); }
    .cust-role-perms__group[open] summary svg { transform: rotate(90deg); }
    .cust-role-perms__group summary > span:last-child { margin-left: auto; font-variant-numeric: tabular-nums; }
    .cust-role-perms__row { display: flex; gap: 12px; align-items: flex-start; padding: 9px 14px 9px 28px; border-top: 1px solid var(--color-border-subtle); cursor: pointer; }
    .cust-role-perms__row:hover { background: var(--color-bg-hover); }
    .cust-role-perms__row.is-on { background: oklch(98% 0.01 262); }
    .cust-role-perms__row input { margin-top: 2px; flex: none; }

    /* Multi-language template editor */
    .tpl-card__langs { display: flex; gap: 6px; padding: 10px 18px; flex-wrap: wrap; border-bottom: 1px solid var(--color-border-subtle); }
    .tpl-lang-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; background: var(--color-bg-3); color: var(--color-text-secondary); border: 1px solid var(--color-border-default); }
    .tpl-lang-chip.is-default { background: var(--color-primary-50); color: var(--color-primary-700); border-color: oklch(85% 0.06 262); }
    .tpl-lang-chip__star { font-size: 9px; color: var(--color-warning-700); }
    .tpl-lang-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 20px; border-bottom: 1px solid var(--color-border-subtle); background: var(--color-bg-3); }
    .tpl-lang-bar__tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
    .tpl-lang-tab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: transparent; border: 1px solid transparent; font: 500 12.5px var(--font-family-sans); color: var(--color-text-secondary); cursor: pointer; transition: all var(--duration-fast); }
    .tpl-lang-tab:hover { background: var(--color-bg-2); color: var(--color-text-primary); }
    .tpl-lang-tab.is-active { background: var(--color-bg-2); border-color: var(--color-border-default); color: var(--color-text-primary); box-shadow: var(--shadow-1); }
    .tpl-lang-tab__star { color: var(--color-warning-700); font-size: 11px; }
    .tpl-lang-tab__x { display: inline-flex; padding: 2px; border-radius: 4px; opacity: 0.5; }
    .tpl-lang-tab__x:hover { opacity: 1; background: var(--color-danger-50); color: var(--color-danger-700); }
    .tpl-lang-tab--add { border: 1px dashed var(--color-border-default); color: var(--color-text-tertiary); }
    .tpl-lang-tab--add:disabled { opacity: 0.4; cursor: not-allowed; }
    .tpl-lang-menu { position: absolute; top: calc(100% + 4px); left: 0; min-width: 180px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 10px; box-shadow: var(--shadow-2); padding: 4px; z-index: 100; display: flex; flex-direction: column; }
    .tpl-lang-menu button { background: transparent; border: 0; text-align: left; padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--color-text-primary); }
    .tpl-lang-menu button:hover { background: var(--color-bg-hover); }
    .tpl-multi-banner { display: flex; gap: 8px; align-items: flex-start; padding: 10px 20px; background: oklch(96% 0.04 230 / 0.6); border-bottom: 1px solid oklch(80% 0.08 230 / 0.4); font-size: 12px; color: var(--color-info-700); line-height: 1.5; }
    .tpl-multi-banner svg { flex: none; margin-top: 2px; }

    /* Signer preview — customer-facing signing simulation */
    .signer-preview {
      position: fixed; inset: 0; z-index: 1000;
      display: grid; grid-template-rows: auto auto 1fr auto;
      background: oklch(96% 0.005 250);
      animation: signerFadeIn 0.22s ease;
    }
    @keyframes signerFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .signer-banner {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px;
      background: linear-gradient(90deg, oklch(60% 0.18 50), oklch(64% 0.16 35));
      color: white; font-size: 13px;
    }
    .signer-banner__pill { display: inline-flex; align-items: center; padding: 2px 8px; background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
    .signer-banner strong { font-weight: 600; }
    .signer-banner__sub { color: rgba(255,255,255,0.85); font-size: 12.5px; }
    .signer-banner__close { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.35); color: white; padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; transition: background var(--duration-fast); }
    .signer-banner__close:hover { background: rgba(255,255,255,0.28); }
    .signer-banner__close kbd { font-family: var(--font-family-mono); font-size: 10.5px; background: rgba(0,0,0,0.18); padding: 1px 5px; border-radius: 3px; }

    .signer-chrome { display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; background: white; border-bottom: 1px solid var(--color-border-subtle); }
    .signer-chrome__brand { display: flex; align-items: center; gap: 12px; }
    .signer-chrome__logo { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; background: oklch(22% 0.02 250); color: white; font-family: var(--font-family-serif, Georgia, serif); font-weight: 700; font-size: 18px; }
    .signer-chrome__brandname { font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
    .signer-chrome__path { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 1px; }
    .signer-chrome__user { display: flex; align-items: center; gap: 12px; }
    .signer-chrome__avatar { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: oklch(70% 0.12 35); color: white; font-size: 13px; font-weight: 600; }

    .signer-main { overflow: auto; padding: 32px 20px 24px; }
    .signer-doc { max-width: 880px; margin: 0 auto; background: white; border: 1px solid var(--color-border-subtle); border-radius: 14px; box-shadow: 0 10px 40px -20px oklch(20% 0.02 250 / 0.25); overflow: hidden; }
    .signer-doc__hero { display: flex; align-items: flex-start; gap: 16px; padding: 24px 28px; border-bottom: 1px solid var(--color-border-subtle); background: linear-gradient(180deg, oklch(98% 0.005 250), white); }
    .signer-doc__hero-text { flex: 1; min-width: 0; }
    .signer-doc__kicker { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-tertiary); margin-bottom: 4px; }
    .signer-doc__title { font-size: 22px; font-weight: 600; color: var(--color-text-primary); letter-spacing: -0.01em; }
    .signer-doc__sub { font-size: 13px; color: var(--color-text-secondary); margin-top: 4px; }
    .signer-doc__status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: oklch(96% 0.04 70); color: oklch(45% 0.12 60); font-size: 12px; font-weight: 500; border: 1px solid oklch(88% 0.06 70); white-space: nowrap; }
    .signer-doc__status-dot { width: 7px; height: 7px; border-radius: 50%; background: oklch(70% 0.15 60); box-shadow: 0 0 0 0 oklch(70% 0.15 60 / 0.5); animation: signerPulse 1.8s ease-in-out infinite; }
    .signer-doc__status.is-signed { background: oklch(95% 0.05 150); color: oklch(40% 0.14 150); border-color: oklch(82% 0.10 150); }
    .signer-doc__status.is-signed .signer-doc__status-dot { background: oklch(55% 0.16 150); animation: none; }
    @keyframes signerPulse { 0%, 100% { box-shadow: 0 0 0 0 oklch(70% 0.15 60 / 0.45); } 50% { box-shadow: 0 0 0 6px oklch(70% 0.15 60 / 0); } }

    .signer-doc__parties { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 0; padding: 0; border-bottom: 1px solid var(--color-border-subtle); background: var(--color-bg-3); }
    .signer-doc__parties > div { padding: 14px 18px; border-right: 1px solid var(--color-border-subtle); }
    .signer-doc__parties > div:last-child { border-right: 0; }
    .signer-doc__parties dt { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-tertiary); margin-bottom: 5px; }
    .signer-doc__parties dd { margin: 0; font-size: 13px; line-height: 1.45; color: var(--color-text-primary); }

    .signer-doc__langbar { display: flex; align-items: center; gap: 14px; padding: 12px 28px; border-bottom: 1px solid var(--color-border-subtle); background: white; }
    .signer-doc__lang-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .signer-doc__lang-tab { padding: 5px 12px; border-radius: 8px; background: transparent; border: 1px solid transparent; font: 500 12.5px var(--font-family-sans); color: var(--color-text-secondary); cursor: pointer; transition: all var(--duration-fast); }
    .signer-doc__lang-tab:hover { background: var(--color-bg-3); color: var(--color-text-primary); }
    .signer-doc__lang-tab.is-active { background: var(--color-bg-3); border-color: var(--color-border-default); color: var(--color-text-primary); }

    .signer-doc__body { max-height: min(56vh, 580px); overflow-y: auto; padding: 28px 36px; font-size: 14.5px; line-height: 1.7; color: var(--color-text-primary); scroll-behavior: smooth; }
    .signer-doc__body .md__h1 { font-size: 20px; margin-top: 0; }
    .signer-doc__body .md__h2 { font-size: 16px; margin-top: 24px; }
    .signer-doc__end { text-align: center; margin: 28px 0 4px; font-size: 12px; color: var(--color-text-tertiary); letter-spacing: 0.04em; }

    .signer-doc__scroll-hint { display: flex; align-items: center; gap: 8px; padding: 12px 28px; background: oklch(96% 0.03 230); border-top: 1px solid oklch(85% 0.06 230 / 0.4); color: var(--color-info-700); font-size: 12.5px; }

    .signer-foot { background: white; border-top: 1px solid var(--color-border-subtle); box-shadow: 0 -4px 16px -8px oklch(20% 0.02 250 / 0.15); }
    .signer-foot__inner { max-width: 880px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; gap: 24px; align-items: end; padding: 18px 28px; }
    .signer-check { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.5; color: var(--color-text-primary); cursor: pointer; }
    .signer-check input { margin-top: 2px; flex: none; width: 16px; height: 16px; accent-color: var(--color-primary-600); }
    .signer-check.is-disabled { opacity: 0.5; cursor: not-allowed; }
    .signer-sig { display: flex; flex-direction: column; gap: 4px; }
    .signer-sig > label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-tertiary); }
    .signer-sig__inputwrap { position: relative; }
    .signer-sig input { width: 100%; padding: 8px 12px; border: 1px solid var(--color-border-default); border-radius: 8px; font: 14px var(--font-family-sans); background: white; }
    .signer-sig input:disabled { background: var(--color-bg-3); cursor: not-allowed; }
    .signer-sig input:focus { outline: 2px solid var(--color-primary-200); border-color: var(--color-primary-600); }
    .signer-sig__preview { margin-top: 6px; padding: 8px 14px; border: 1px dashed var(--color-border-default); border-radius: 8px; font-family: 'Caveat', 'Brush Script MT', cursive; font-size: 26px; color: var(--color-primary-700); min-height: 44px; display: flex; align-items: center; transition: opacity var(--duration-fast); background: oklch(99% 0.005 250); }
    .signer-foot__actions { display: flex; gap: 8px; align-items: center; }

    @media (max-width: 900px) {
      .signer-doc__parties { grid-template-columns: 1fr 1fr; }
      .signer-doc__parties > div:nth-child(2) { border-right: 0; }
      .signer-foot__inner { grid-template-columns: 1fr; gap: 14px; }
    }

    /* Permissions card — scalable */
    .perms-card { display: flex; flex-direction: column; min-height: 0; }
    .perms-card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .perms-card__sub { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .perms-card__sub .num strong { color: var(--color-text-primary); font-weight: 600; }
    .perms-card__sub .dot { opacity: 0.5; }
    .perms-card__body { display: flex; flex-direction: column; max-height: 540px; overflow-y: auto; }
    .perms-card__body::-webkit-scrollbar { width: 10px; }
    .perms-card__body::-webkit-scrollbar-thumb { background: var(--color-border-default); border-radius: 999px; border: 2px solid var(--color-bg-2); }

    .perms-toolbar { display: flex; flex-direction: column; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--color-border-subtle); background: var(--color-bg-2); position: sticky; top: 0; z-index: 2; }
    .perms-toolbar__row { display: flex; align-items: center; gap: 10px; }
    .perms-toolbar__row > .tds-input { flex: 1; min-width: 0; }
    .perms-toolbar__chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .perms-toolbar__chiplabel { font-size: 11px; font-weight: 500; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-right: 2px; }

    .perm-seg { display: inline-flex; background: var(--color-bg-3); border: 1px solid var(--color-border-default); border-radius: 8px; padding: 2px; flex: none; }
    .perm-seg__btn { background: transparent; border: 0; padding: 4px 10px; font: 500 12px var(--font-family-sans); color: var(--color-text-secondary); border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all var(--duration-fast); }
    .perm-seg__btn:hover { color: var(--color-text-primary); }
    .perm-seg__btn.is-on { background: var(--color-bg-2); color: var(--color-text-primary); box-shadow: var(--shadow-1); }
    .perm-seg__count { font: 600 10px var(--font-family-mono); padding: 1px 5px; border-radius: 4px; background: var(--color-bg-3); color: var(--color-text-tertiary); font-variant-numeric: tabular-nums; }
    .perm-seg__btn.is-on .perm-seg__count { background: var(--color-primary-50); color: var(--color-primary-700); }

    .perm-fchip { background: var(--color-bg-2); border: 1px solid var(--color-border-default); padding: 3px 9px; border-radius: 999px; font: 500 11.5px var(--font-family-sans); color: var(--color-text-secondary); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all var(--duration-fast); }
    .perm-fchip:hover { border-color: var(--color-border-strong); color: var(--color-text-primary); }
    .perm-fchip.is-on { background: var(--color-primary-700); border-color: var(--color-primary-700); color: #fff; }
    .perm-fchip--isv.is-on      { background: var(--color-accent-700);  border-color: var(--color-accent-700); }
    .perm-fchip--iso.is-on      { background: var(--color-info-700);    border-color: var(--color-info-700); }
    .perm-fchip--acquirer.is-on { background: var(--color-success-700); border-color: var(--color-success-700); }
    .perm-fchip--payfac.is-on   { background: var(--color-warning-700); border-color: var(--color-warning-700); }
    .perm-fchip--merchant.is-on { background: oklch(48% 0.13 190); border-color: oklch(48% 0.13 190); }
    .perm-fchip--admin.is-on    { background: oklch(38% 0.05 280); border-color: oklch(38% 0.05 280); }
    .perm-fchip--clear { margin-left: auto; color: var(--color-text-tertiary); }
    .perm-fchip--clear:hover { color: var(--color-danger-700); border-color: var(--color-danger-700); }

    /* Make perm-group__head work as a button */
    .perm-group__head--btn { width: 100%; border: 0; background: var(--color-bg-3); cursor: pointer; gap: 12px; text-align: left; font: inherit; color: inherit; }
    .perm-group__head--btn:hover:not(:disabled) { background: var(--color-bg-hover); }
    .perm-group__head--btn:disabled { cursor: default; }
    .perm-group__chev { color: var(--color-text-tertiary); transition: transform var(--duration-fast); display: inline-flex; }
    .perm-group__bar { width: 56px; height: 4px; border-radius: 999px; background: var(--color-bg-2); border: 1px solid var(--color-border-subtle); overflow: hidden; flex: none; }
    .perm-group__bar-fill { display: block; height: 100%; background: var(--color-primary-700); transition: width var(--duration-fast); }

    /* Compact row variant — denser for long lists */
    .perm-row--compact { padding: 9px 20px 9px 28px; gap: 12px; align-items: center; }
    .perm-row--compact .perm-row__desc { display: none; }
    .perm-row--compact:hover .perm-row__desc,
    .perm-row--compact.is-on .perm-row__desc { display: block; margin-top: 2px; }
    .perm-row--compact .perm-row__name { font-size: 13px; }

    /* Toggle switch */
    .tg { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--color-bg-3); border: 1px solid var(--color-border-default); cursor: pointer; padding: 0; flex: none; transition: all var(--duration-fast); }
    .tg__knob { position: absolute; top: 1px; left: 1px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-1); transition: transform var(--duration-fast) var(--easing-emphasized); }
    .tg.is-on { background: var(--color-primary-700); border-color: var(--color-primary-700); }
    .tg.is-on .tg__knob { transform: translateX(14px); }
    .tg.is-disabled { opacity: 0.5; cursor: not-allowed; }

    /* Contract templates grid */
    .tpl-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .tpl-card { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); overflow: hidden; display: flex; flex-direction: column; }
    .tpl-card__top { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 12px; }
    .tpl-card__title-wrap { flex: 1; min-width: 0; }
    .tpl-card__title { display: flex; align-items: baseline; gap: 8px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .tpl-card__ver { font: 500 12px var(--font-family-mono); color: var(--color-text-tertiary); }
    .tpl-card__desc { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }
    .tpl-card__stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 0; padding: 12px 18px; background: var(--color-bg-3); border-top: 1px solid var(--color-border-subtle); border-bottom: 1px solid var(--color-border-subtle); }
    .tpl-card__stats > div { padding: 0 8px; border-right: 1px solid var(--color-border-subtle); }
    .tpl-card__stats > div:first-child { padding-left: 0; }
    .tpl-card__stats > div:last-child { border-right: 0; padding-right: 0; }
    .tpl-card__stats dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-tertiary); font-weight: 500; }
    .tpl-card__stats dd { margin: 2px 0 0; font-size: 12.5px; font-weight: 500; color: var(--color-text-primary); font-variant-numeric: tabular-nums; }
    .tpl-card__preview { position: relative; padding: 14px 18px; font: 12px/1.5 var(--font-family-mono); color: var(--color-text-secondary); max-height: 96px; overflow: hidden; }
    .tpl-card__fade { position: absolute; left: 0; right: 0; bottom: 0; height: 50px; background: linear-gradient(to bottom, transparent, var(--color-bg-2)); pointer-events: none; }
    .tpl-card__actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--color-border-subtle); }

    /* Template editor overlay */
    .tpl-editor-overlay { position: fixed; inset: 0; background: oklch(20% 0.01 260 / 0.55); backdrop-filter: blur(2px); z-index: var(--z-modal, 1000); display: grid; place-items: center; padding: 24px; animation: fadeIn 160ms ease-out; }
    .tpl-editor { width: min(1180px, 100%); max-height: 90vh; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 14px; box-shadow: var(--shadow-4); display: flex; flex-direction: column; overflow: hidden; }
    .tpl-editor__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 22px; border-bottom: 1px solid var(--color-border-subtle); }
    .tpl-editor__body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0; overflow: hidden; }
    .tpl-editor__form { padding: 18px 22px; overflow: auto; display: flex; flex-direction: column; gap: 14px; border-right: 1px solid var(--color-border-subtle); }
    .tpl-textarea { min-height: 320px; font: 13px/1.55 var(--font-family-mono); }
    .tpl-editor__version { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 8px; }
    .tpl-editor__preview { display: flex; flex-direction: column; background: var(--color-bg-1); overflow: hidden; }
    .tpl-editor__preview-head { display: flex; align-items: center; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--color-border-subtle); font-size: 12px; font-weight: 500; color: var(--color-text-secondary); background: var(--color-bg-2); }
    .tpl-editor__preview-body { flex: 1; overflow: auto; padding: 24px 28px; }
    .tpl-editor__foot { display: flex; align-items: center; justify-content: space-between; padding: 12px 22px; border-top: 1px solid var(--color-border-subtle); background: var(--color-bg-2); }

    /* Markdown */
    .md { color: var(--color-text-primary); font-size: 13.5px; line-height: 1.6; }
    .md__h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 12px; }
    .md__h2 { font-size: 14px; font-weight: 600; margin: 18px 0 6px; color: var(--color-text-primary); }
    .md__p { margin: 0 0 10px; color: var(--color-text-secondary); }
    .md__ul { margin: 0 0 10px; padding-left: 20px; color: var(--color-text-secondary); }
    .md__ul li { margin-bottom: 4px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }

    /* ─── Apps list ───────────────────────────────────── */
    .al-app { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .al-app__name { font-size: 13.5px; font-weight: 500; color: var(--color-text-primary); letter-spacing: -0.005em; }
    .al-app__pkg { font: 500 11.5px var(--font-family-mono); color: var(--color-text-tertiary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .al-pub { display: inline-flex; align-items: center; gap: 6px; }
    .al-pub__name { font-size: 13px; color: var(--color-text-primary); font-weight: 500; }
    .al-clear { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; height: 32px; border-radius: 6px; background: transparent; border: 1px solid var(--color-border-default); color: var(--color-text-secondary); font: 500 12.5px var(--font-family-sans); cursor: pointer; transition: all 0.12s; }
    .al-clear:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }
    .al-clear__count { padding: 1px 6px; border-radius: 999px; background: var(--color-primary-700); color: #fff; font-size: 10.5px; font-weight: 600; min-width: 18px; text-align: center; }

    /* ─── App detail ──────────────────────────────────── */
    .ad-grid { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: start; }
    @media (max-width: 980px) { .ad-grid { grid-template-columns: 1fr; } }
    .ad-chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); font: 500 11.5px var(--font-family-mono); color: var(--color-text-secondary); letter-spacing: 0.01em; }
    .ad-pub-link { display: inline-flex; align-items: center; gap: 4px; background: transparent; border: 0; padding: 0; font: 500 12.5px var(--font-family-sans); color: var(--color-primary-700); cursor: pointer; }
    .ad-pub-link:hover { text-decoration: underline; }
    .ad-pub-link svg { color: currentColor; opacity: 0.7; }
    .ad-vstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 24px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--color-border-subtle); }
    .ad-vstats > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .ad-vstats dt { font: 500 10.5px var(--font-family-sans); color: var(--color-text-tertiary); letter-spacing: 0.06em; text-transform: uppercase; }
    .ad-vstats dd { margin: 0; font-size: 13px; color: var(--color-text-primary); font-weight: 500; }
    .ad-publisher { display: flex; align-items: flex-start; gap: 12px; }
