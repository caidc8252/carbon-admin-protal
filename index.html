<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOMS · Customer Admin</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/components.css" />
  <link rel="stylesheet" href="assets/devices-aliases.css" />
  <!-- App Publish (reference) design tokens & type scale. Adds --fg*, --bg*,
       --accent aliases and .h1–.h4/.body/.body-sm/.overline/.mono classes that
       the embedded App Publish bundle depends on. Both share the same primitive
       token names (--color-bg-1 etc.) so these import cleanly. -->
  <link rel="stylesheet" href="app-publish/tds/colors_and_type.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    /* ─── App Publish host overrides ────────────────────────────
       The App Publish bundle mounts its full <App/> (with its own
       Sidebar + TopBar + TweaksPanel) inside .ap-host. Hide that
       chrome so it integrates with the Carbon admin shell. */
    .ap-host .carbon-root { height: 100%; }
    .ap-host aside { display: none !important; }
    .ap-host .carbon-root > div > main > div:first-child { display: none !important; }
    .ap-host [role="tablist"]:first-child { display: none !important; }
    .ap-host .twk-panel { display: none !important; }
    /* App Publish — Overview two-column layout (narrative left, Latest version
       right). The bundle declares this in its own index.html, which this shell
       doesn't load, so mirror the rule here. */
    .ap-host .app-overview { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; max-width: 1280px; margin: 0 auto; width: 100%; align-items: start; }
    @media (max-width: 1100px) { .ap-host .app-overview { grid-template-columns: minmax(0, 1fr); } }

    html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font-family-sans); color: var(--color-text-primary); background: var(--color-bg-1); -webkit-font-smoothing: antialiased; }
    *, *::before, *::after { box-sizing: border-box; }
    #root { height: 100%; }
    button { font-family: inherit; }

    /* Shell */
    .app { display: grid; grid-template-columns: 248px 1fr; height: 100vh; }
    .side { background: var(--color-bg-3); border-right: 1px solid var(--color-border-default); display: flex; flex-direction: column; min-height: 0; }
    .side__scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 8px; scrollbar-width: thin; scrollbar-color: var(--color-border-default) transparent; }
    .side__scroll::-webkit-scrollbar { width: 8px; }
    .side__scroll::-webkit-scrollbar-thumb { background: var(--color-border-default); border-radius: 4px; }
    .side__scroll::-webkit-scrollbar-thumb:hover { background: var(--color-border-strong); }
    .side__scroll::-webkit-scrollbar-track { background: transparent; }
    .side__brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
    .side__logo { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; flex: none; }
    .side__logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .__side_logo_legacy_dead { color: #fff; background: var(--color-primary-700); font-weight: 700; font-size: 13px; letter-spacing: -0.02em; box-shadow: var(--shadow-cta); }
    .side__name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
    .side__name small { display: block; font-size: 11px; color: var(--color-text-tertiary); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
    .side__sectionlabel { padding: 14px 18px 6px; font-size: 11px; color: var(--color-text-tertiary); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .side__nav { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
    .side__item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--color-text-secondary); font-size: 13.5px; font-weight: 500; cursor: pointer; user-select: none; }
    .side__item:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }
    .side__item.is-active { background: var(--color-bg-2); color: var(--color-text-primary); box-shadow: var(--shadow-1); }
    .side__item svg { color: var(--color-text-tertiary); flex: none; }
    .side__item.is-active svg { color: var(--color-primary-700); }
    .side__item.is-parent.is-open { color: var(--color-text-primary); }
    .side__chev { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; color: var(--color-text-tertiary); transition: transform 0.15s ease; }
    .side__chev:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }
    .side__chev.is-open { transform: rotate(90deg); }
    .side__sublist { display: flex; flex-direction: column; gap: 1px; padding: 2px 10px 4px 10px; position: relative; }
    .side__sublist::before { content: ''; position: absolute; left: 26px; top: 4px; bottom: 6px; width: 1px; background: var(--color-border-subtle); }
    .side__sub { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 32px; border-radius: 6px; color: var(--color-text-tertiary); font-size: 13px; font-weight: 500; cursor: pointer; user-select: none; position: relative; }
    .side__sub:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }
    .side__sub.is-active { background: var(--color-bg-2); color: var(--color-text-primary); box-shadow: var(--shadow-1); }
    .side__sub.is-active::before { content: ''; position: absolute; left: 25px; top: 50%; transform: translateY(-50%); width: 3px; height: 14px; border-radius: 2px; background: var(--color-primary-500); }
    .side__footer { margin-top: auto; padding: 12px 14px; border-top: 1px solid var(--color-border-subtle); display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--color-text-tertiary); }
    .side__avatar > img, .um-head__avatar > img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
    .side__avatar { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, var(--color-primary-500), var(--color-accent-600)); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; }

    /* Main */
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100vh; }
    .topbar { height: 56px; background: var(--color-bg-2); border-bottom: 1px solid var(--color-border-default); display: flex; align-items: center; padding: 0 24px; gap: 16px; flex: none; }
    .crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--color-text-secondary); }
    .crumbs__sep { color: var(--color-text-tertiary); }
    .crumbs__current { color: var(--color-text-primary); font-weight: 500; }
    .crumbs a { color: inherit; text-decoration: none; cursor: pointer; }
    .crumbs a:hover { color: var(--color-text-primary); }
    .topbar__spacer { flex: 1; }
    .topbar__search { display: flex; align-items: center; gap: 8px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 6px; padding: 0 10px; height: 32px; flex: 0 1 280px; min-width: 0; font-size: 13px; color: var(--color-text-tertiary); cursor: pointer; border: 0; font-family: inherit; }
    .topbar__search:hover { background: var(--color-bg-2); border-color: var(--color-border-default); }
    .topbar__search > svg { flex: none; }
    .topbar__search > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    .topbar__search kbd { flex: none; font: 500 11px/1 var(--font-family-mono); background: var(--color-bg-2); border: 1px solid var(--color-border-subtle); border-radius: 4px; padding: 2px 5px; color: var(--color-text-tertiary); }
    @media (max-width: 900px) { .topbar__search kbd { display: none; } }

    /* Command palette */
    .cmdk-backdrop { position: fixed; inset: 0; background: oklch(0% 0 0 / 0.32); display: grid; place-items: start center; padding-top: 12vh; z-index: 9000; animation: fadeIn 120ms ease; }
    .cmdk { width: min(640px, 92vw); background: var(--color-bg-1); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: 0 24px 64px oklch(0% 0 0 / 0.25); overflow: hidden; display: flex; flex-direction: column; max-height: 70vh; }
    .cmdk__head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--color-border-subtle); }
    .cmdk__input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: var(--color-text-primary); }
    .cmdk__body { overflow: auto; padding: 6px 0; }
    .cmdk__group { padding: 4px 0; }
    .cmdk__grouplabel { padding: 6px 16px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--color-text-tertiary); }
    .cmdk__item { display: flex; align-items: center; gap: 12px; padding: 9px 16px; cursor: pointer; }
    .cmdk__item:hover, .cmdk__item.is-active { background: var(--color-bg-3); }
    .cmdk__item-icon { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; background: var(--color-bg-3); color: var(--color-text-secondary); flex: none; }
    .cmdk__item-text { flex: 1; min-width: 0; }
    .cmdk__item-title { font-size: 13.5px; color: var(--color-text-primary); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmdk__item-sub { font-size: 12px; color: var(--color-text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmdk__empty { padding: 28px 16px; text-align: center; color: var(--color-text-tertiary); font-size: 13px; }
    .cmdk__foot { padding: 8px 14px; border-top: 1px solid var(--color-border-subtle); font-size: 11px; color: var(--color-text-tertiary); display: flex; gap: 14px; }
    .cmdk__foot kbd { font: 500 10px/1 var(--font-family-mono); background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 3px; padding: 2px 5px; margin: 0 3px; }
    .content { flex: 1; overflow: auto; }

    /* Page wrapper */
    .page { max-width: 1200px; margin: 0 auto; padding: 28px 32px 64px; }
    .page__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .page__title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
    .page__sub { font-size: 13.5px; color: var(--color-text-secondary); margin: 0; }
    .page__actions { display: flex; gap: 8px; align-items: center; }

    /* Common */
    .row { display: flex; align-items: center; gap: 8px; }
    .row--gap-12 { gap: 12px; }
    .row--gap-16 { gap: 16px; }
    .col { display: flex; flex-direction: column; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .stack--sm { gap: 8px; }
    .stack--lg { gap: 20px; }
    .muted { color: var(--color-text-tertiary); }
    .num { font-variant-numeric: tabular-nums; }

    /* Customer list */
    .list-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .list-toolbar .tds-input { width: 260px; }
    .list-toolbar__filters { display: flex; gap: 8px; align-items: center; }
    .table-card { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-2); overflow: hidden; }
    .table-card .tds-table thead th:first-child { padding-left: 20px; }
    .table-card .tds-table tbody td:first-child { padding-left: 20px; }
    .table-card .tds-table thead th:last-child { padding-right: 20px; }
    .table-card .tds-table tbody td:last-child { padding-right: 20px; }
    .table-card .tds-table tbody tr { cursor: pointer; }
    .cust-cell { display: flex; align-items: center; gap: 10px; }
    .cust-avatar { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-weight: 600; font-size: 12px; color: #fff; flex: none; letter-spacing: -0.01em; }
    .cust-name { font-weight: 500; color: var(--color-text-primary); }
    .cust-meta { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }
    .badge-row { display: inline-flex; flex-wrap: wrap; gap: 4px; }
    .iconbtn { width: 28px; height: 28px; border-radius: 6px; display: inline-grid; place-items: center; border: 1px solid transparent; background: transparent; color: var(--color-text-tertiary); cursor: pointer; }
    .iconbtn:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }
    .iconbtn:disabled { opacity: 0.4; cursor: not-allowed; }
    .iconbtn:disabled:hover { background: transparent; color: var(--color-text-tertiary); }
    .iconbtn--danger:hover { background: var(--color-error-50); color: var(--color-error-700); }

    /* ─── List page (Customers) — ui-spec §1 / §7.2 / §7.4 ───────
       Title moved to the fixed TitleBar band; the page is full-bleed
       (no max-width, not centered) and the search/condition area scrolls
       away while only list-head + thead pin to the .content top. */
    .page--list { max-width: none; margin: 0; padding: 24px 32px 64px; }
    /* Detail pages — content centered at 1200 (ui-spec §1② / §8.1); the TitleBar
       band itself stays full-bleed. */
    .page--detail { max-width: 1200px; margin: 0 auto; padding: 24px 32px 64px; }
    /* §7.2 FIX — on list pages the search/condition area is NOT sticky
       (scrolls with content); only list-head + thead pin to the .content top
       (right under the fixed TitleBar). Applies to every .page--list. */
    .page--list .list-toolbar-wrap { position: static; top: auto; z-index: auto; padding-top: 0; padding-bottom: 16px; }
    .page--list .list-card__head { top: 0; }
    .page--list .list-card table.tds-table thead th { top: var(--lc-head-h); }

    /* ─── Notification center (top-bar bell + popover) ───────── */
    .nc { position: relative; display: inline-flex; }
    .nc__bell { position: relative; }
    .nc__bell.is-open { background: var(--color-bg-hover); color: var(--color-text-primary); }
    .nc__badge { position: absolute; top: -2px; right: -2px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 999px; background: var(--color-error-700); color: #fff; font: 600 9.5px/1 var(--font-family-mono); display: grid; place-items: center; border: 1.5px solid var(--color-bg-2); font-variant-numeric: tabular-nums; }

    .nc-pop { position: absolute; top: calc(100% + 10px); right: 0; width: 448px; max-width: calc(100vw - 32px); background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-5); z-index: 1080; overflow: hidden; display: flex; flex-direction: column; animation: ncPopIn 0.16s var(--easing-emphasized); }
    @keyframes ncPopIn { from { opacity: 0; transform: translateY(-6px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { .nc-pop { animation: none; } }

    .nc-pop__head { display: flex; align-items: center; gap: 8px; padding: 13px 14px; border-bottom: 1px solid var(--color-border-subtle); }
    .nc-pop__title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--color-text-primary); }
    .nc-pop__count { font: 600 10px/1 var(--font-family-mono); padding: 2px 6px; border-radius: 999px; background: var(--color-primary-50); color: var(--color-primary-700); border: 1px solid oklch(60% 0.14 262 / 0.25); font-variant-numeric: tabular-nums; }
    .nc-pop__allread { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 0; padding: 5px 8px; border-radius: 6px; font: 500 12px var(--font-family-sans); color: var(--color-text-secondary); cursor: pointer; transition: background var(--duration-fast); }
    .nc-pop__allread:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }
    .nc-pop__allread:disabled { opacity: 0.4; cursor: not-allowed; }
    .nc-pop__allread:disabled:hover { background: transparent; color: var(--color-text-secondary); }

    .nc-pop__tabs { display: flex; gap: 2px; padding: 8px 10px; border-bottom: 1px solid var(--color-border-subtle); overflow-x: auto; scrollbar-width: none; }
    .nc-pop__tabs::-webkit-scrollbar { display: none; }
    .nc-tab { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--color-text-secondary); background: transparent; border: 1px solid transparent; cursor: pointer; white-space: nowrap; font-family: inherit; transition: background var(--duration-fast); }
    .nc-tab:hover { background: var(--color-bg-hover); }
    .nc-tab.is-on { background: var(--color-bg-3); color: var(--color-text-primary); border-color: var(--color-border-subtle); }
    .nc-tab__n { font: 600 9.5px/1 var(--font-family-mono); padding: 2px 4px; border-radius: 999px; background: var(--color-primary-700); color: #fff; min-width: 15px; text-align: center; font-variant-numeric: tabular-nums; }

    .nc-pop__scroll { max-height: min(460px, calc(100vh - 180px)); overflow-y: auto; }
    .nc-group { font: 600 10.5px var(--font-family-sans); text-transform: uppercase; letter-spacing: 0.07em; color: var(--color-text-tertiary); padding: 12px 16px 6px; }

    .nc-row { display: grid; grid-template-columns: 8px 30px 1fr auto; gap: 10px; padding: 11px 14px 12px; border-bottom: 1px solid var(--color-border-subtle); align-items: start; cursor: pointer; text-align: left; transition: background var(--duration-fast); }
    .nc-row:hover { background: var(--color-bg-hover); }
    .nc-row:last-child { border-bottom: 0; }
    .nc-row__dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: transparent; }
    .nc-row.is-unread .nc-row__dot { background: var(--color-primary-500); }
    .nc-row__icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; border: 1px solid transparent; }
    .nc-row__main { min-width: 0; }
    .nc-row__title { font-size: 13px; line-height: 1.4; color: var(--color-text-primary); }
    .nc-row.is-unread .nc-row__title { font-weight: 600; }
    .nc-row.is-read .nc-row__title { font-weight: 500; }
    .nc-row__body { font-size: 12px; color: var(--color-text-secondary); margin-top: 3px; line-height: 1.5; }
    .nc-row__time { font-size: 11px; color: var(--color-text-tertiary); margin-top: 6px; font-variant-numeric: tabular-nums; }
    .nc-row.is-read { opacity: 0.66; }
    .nc-row.is-read:hover { opacity: 1; }
    .nc-row__chev { color: var(--color-text-tertiary); align-self: center; display: grid; place-items: center; }
    .nc-row__mark { align-self: center; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--color-border-subtle); background: var(--color-bg-2); color: var(--color-text-tertiary); cursor: pointer; opacity: 0; transition: opacity var(--duration-fast), background var(--duration-fast), color var(--duration-fast); }
    .nc-row:hover .nc-row__mark { opacity: 1; }
    .nc-row__mark:hover { background: var(--color-primary-50); color: var(--color-primary-700); border-color: oklch(60% 0.14 262 / 0.25); }

    .nc-empty { padding: 44px 24px; text-align: center; }
    .nc-empty svg { color: var(--color-border-strong); }
    .nc-empty__t { font-size: 13.5px; font-weight: 600; color: var(--color-text-secondary); margin-top: 10px; }
    .nc-empty__s { font-size: 12px; color: var(--color-text-tertiary); margin-top: 4px; max-width: 280px; margin-left: auto; margin-right: auto; line-height: 1.5; }

    .nc-pop__foot { padding: 8px; border-top: 1px solid var(--color-border-subtle); }
    .nc-pop__viewall { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; border-radius: 8px; background: transparent; border: 0; font: 500 12.5px var(--font-family-sans); color: var(--color-primary-700); cursor: pointer; transition: background var(--duration-fast); }
    .nc-pop__viewall:hover { background: var(--color-primary-50); }
    .nc-pop__more-hint { text-align: center; font-size: 11.5px; color: var(--color-text-tertiary); padding: 2px 0 8px; font-variant-numeric: tabular-nums; }

    /* ─── Notifications full page (table cells) ──────────────── */
    .nc-table tbody tr { cursor: pointer; }
    .nc-table .nc-tr-unread { background: oklch(60% 0.14 262 / 0.035); }
    .nc-cell-ic { display: inline-flex; align-items: center; gap: 8px; }
    .nc-cell-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .nc-cell-title { font-size: 13.5px; line-height: 1.4; color: var(--color-text-primary); font-weight: 500; }
    .nc-cell-title.is-unread { font-weight: 600; }
    .nc-cell-body { font-size: 12.5px; color: var(--color-text-secondary); margin-top: 3px; line-height: 1.5; }
    .nc-cell-time { font: 400 12px var(--font-family-mono); color: var(--color-text-tertiary); font-variant-numeric: tabular-nums; }
    .nc-cell-chev { color: var(--color-border-strong); display: inline-grid; place-items: center; }
    .nc-table tbody tr:hover .nc-cell-chev { color: var(--color-text-tertiary); }
    .nc-modchip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 6px; border-radius: 999px; border: 1px solid transparent; font: 500 11.5px var(--font-family-sans); white-space: nowrap; }

    /* ─── Notification detail page ───────────────────────────── */
    .ndet-back { background: transparent; border: 0; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--color-text-secondary); display: inline-flex; align-items: center; gap: 4px; font-family: inherit; font-size: 13px; transition: background var(--duration-fast); }
    .ndet-back:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }
    .ndet { max-width: 720px; margin: 0 auto; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: var(--radius-xl); box-shadow: var(--shadow-2); overflow: hidden; }
    .ndet-backrow { max-width: 720px; margin: 0 auto 16px; }
    .ndet__head { display: flex; gap: 16px; align-items: flex-start; padding: 24px 24px 20px; border-bottom: 1px solid var(--color-border-subtle); }
    .ndet__icon { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; flex: none; border: 1px solid transparent; }
    .ndet__head-main { min-width: 0; padding-top: 1px; }
    .ndet__title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; color: var(--color-text-primary); margin: 0; text-wrap: pretty; }
    .ndet__sub { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .ndet__dotsep { color: var(--color-border-strong); }
    .ndet__time { display: inline-flex; align-items: center; gap: 5px; font: 400 12.5px var(--font-family-mono); color: var(--color-text-tertiary); font-variant-numeric: tabular-nums; }

    .ndet__actor { display: flex; align-items: center; gap: 11px; padding: 16px 24px; border-bottom: 1px solid var(--color-border-subtle); background: var(--color-bg-1); }
    .ndet-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--color-bg-3); color: var(--color-text-secondary); display: grid; place-items: center; font: 500 12px var(--font-family-mono); flex: none; border: 1px solid var(--color-border-subtle); }
    .ndet__actor-text { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: 13.5px; }
    .ndet__actor-label { color: var(--color-text-tertiary); }
    .ndet__actor-name { font-weight: 600; color: var(--color-text-primary); }
    .ndet__actor-role { color: var(--color-text-tertiary); }

    .ndet__section { padding: 22px 24px; }
    .ndet__label { font: 600 11px var(--font-family-sans); text-transform: uppercase; letter-spacing: 0.07em; color: var(--color-text-tertiary); margin-bottom: 10px; }
    .ndet__detail { font-size: 14.5px; line-height: 1.65; color: var(--color-text-primary); margin: 0; text-wrap: pretty; }
    .ndet__quote { margin: 0; padding: 12px 16px; border-left: 3px solid var(--color-primary-300); background: var(--color-bg-1); border-radius: 0 8px 8px 0; font-size: 14.5px; line-height: 1.65; color: var(--color-text-primary); text-wrap: pretty; }

    .ndet__metagrid { padding: 4px 24px 8px; border-top: 1px solid var(--color-border-subtle); }
    .ndet__metarow { display: grid; grid-template-columns: 160px 1fr; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--color-border-subtle); }
    .ndet__metarow:last-child { border-bottom: 0; }
    .ndet__meta-label { font-size: 13px; color: var(--color-text-tertiary); }
    .ndet__meta-value { font-size: 13.5px; color: var(--color-text-primary); font-weight: 500; }
    .ndet__meta-value.is-mono { font-family: var(--font-family-mono); font-weight: 400; font-variant-numeric: tabular-nums; }

    .ndet__actions { display: flex; gap: 10px; padding: 18px 24px 22px; border-top: 1px solid var(--color-border-subtle); }

    /* ─── Notification toaster (arrival) ─────────────────────── */
    .nc-toaster { position: fixed; top: 64px; right: 20px; z-index: var(--z-toast); display: flex; flex-direction: column; gap: 10px; width: 360px; max-width: calc(100vw - 40px); pointer-events: none; }
    .nc-toast { pointer-events: auto; position: relative; display: grid; grid-template-columns: 30px 1fr 22px; gap: 11px; align-items: start; padding: 12px 12px 12px 15px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: var(--radius-lg); box-shadow: var(--shadow-4); cursor: pointer; overflow: hidden; animation: ncToastIn var(--duration-normal) var(--easing-emphasized); }
    .nc-toast.is-leaving { animation: ncToastOut var(--duration-fast) var(--easing-standard) forwards; }
    @keyframes ncToastIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes ncToastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(8px); } }
    @media (prefers-reduced-motion: reduce) {
      .nc-toast { animation: ncToastFade var(--duration-fast) ease; }
      .nc-toast.is-leaving { animation: none; opacity: 0; }
      @keyframes ncToastFade { from { opacity: 0; } to { opacity: 1; } }
    }
    .nc-toast__edge { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
    .nc-toast__icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; border: 1px solid transparent; }
    .nc-toast__main { min-width: 0; }
    .nc-toast__title { font-size: 13px; font-weight: 600; line-height: 1.35; color: var(--color-text-primary); }
    .nc-toast__body { font-size: 12px; color: var(--color-text-secondary); margin-top: 3px; line-height: 1.45; }
    .nc-toast__x { align-self: flex-start; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; border: 0; background: transparent; color: var(--color-text-tertiary); cursor: pointer; transition: background var(--duration-fast); }
    .nc-toast__x:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }

    .table-foot { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--color-border-subtle); background: var(--color-bg-2); }
    .table-foot__meta { font-size: 12px; color: var(--color-text-tertiary); }

    /* Wizard — ui-spec §7.3: Stepper 装入标准卡片（bg-2 + 1px 边框 + radius 12 + shadow-1）。
       内部画法对齐工单 StatusStepper：22px 圆点 · 柔和当前点（非实心）· 单行标签 · 左对齐紧凑 · 固定 32 连接条。 */
    .stepper { display: flex; align-items: center; flex-wrap: wrap; gap: 0; margin-bottom: 20px; padding: 16px 20px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); }
    .stepper__item { display: inline-flex; align-items: center; gap: 6px; }
    .stepper__dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--color-bg-2); color: var(--color-text-tertiary); font-size: 10.5px; font-weight: 600; font-family: var(--font-family-mono); font-variant-numeric: tabular-nums; border: 1px solid var(--color-border-default); flex: none; transition: all var(--duration-normal) var(--easing-emphasized); }
    .stepper__dot svg { width: 11px; height: 11px; }
    .stepper__lbl { display: inline-flex; align-items: center; gap: 6px; line-height: 1.15; }
    .stepper__lbl small { display: none; }
    .stepper__lbl strong { font-size: 11.5px; font-weight: 400; color: var(--color-text-tertiary); white-space: nowrap; }
    .stepper__item.is-active .stepper__dot { background: var(--color-primary-100); color: var(--color-primary-700); border-color: color-mix(in oklab, var(--color-primary-500) 35%, transparent); }
    .stepper__item.is-active .stepper__lbl strong { color: var(--color-text-primary); font-weight: 600; }
    .stepper__item.is-done .stepper__dot { background: oklch(94% 0.04 152); color: var(--color-success-700); border-color: color-mix(in oklab, var(--color-success-500) 25%, transparent); }
    .stepper__item.is-done .stepper__lbl strong { color: var(--color-text-secondary); }
    .stepper__bar { width: 32px; height: 1px; background: var(--color-border-default); margin: 0 8px; flex: none; }
    .stepper__bar.is-done { background: color-mix(in oklab, var(--color-success-500) 35%, transparent); opacity: 1; }

    /* Wizard — ui-spec §7.3A 变体 A·卡片 Stepper（正文承载，画法对齐 Order detail StatusPipeline）：
       标准卡 · 36 圆点(序号/✓) · 实心当前点 + shadow-cta · 两行标签 · flex:1 撑满连接条。
       用于全页分步向导（Factory Image / New order）。组件 = shared.jsx 的 <StepperCard>。 */
    .stepper-card { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); padding: 6px 22px; margin-bottom: 20px; }
    .stepper-card .pipe { display: flex; align-items: center; gap: 0; padding: 14px 0; }
    .pipe__step { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .pipe__step.is-clickable { cursor: pointer; }
    .pipe__dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 1px solid var(--color-border-default); background: var(--color-bg-3); color: var(--color-text-tertiary); font-size: 13px; font-weight: 600; font-family: var(--font-family-mono); font-variant-numeric: tabular-nums; }
    .pipe__dot svg { width: 16px; height: 16px; }
    .pipe__lbl { display: flex; flex-direction: column; line-height: 1.15; }
    .pipe__over { font-size: 10.5px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
    .pipe__name { font-size: 13.5px; font-weight: 500; color: var(--color-text-secondary); white-space: nowrap; }
    .pipe__step.active .pipe__dot { background: var(--color-primary-700); color: #fff; border-color: var(--color-primary-700); box-shadow: var(--shadow-cta); }
    .pipe__step.active .pipe__name { color: var(--color-text-primary); font-weight: 600; }
    .pipe__step.done .pipe__dot { background: var(--color-success-50); color: var(--color-success-700); border-color: oklch(58% 0.14 152 / 0.4); }
    .pipe__step.done .pipe__name { color: var(--color-text-primary); font-weight: 600; }
    .pipe__bar { flex: 1; height: 2px; margin: 0 14px; min-width: 30px; background: var(--color-border-default); }
    .pipe__bar.is-done { background: oklch(58% 0.14 152 / 0.4); }
    @media (max-width: 720px) { .stepper-card .pipe { flex-wrap: wrap; gap: 10px 16px; } .pipe__bar { display: none; } }

    .wizard-grid { display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; }
    .wizard-grid--wide { grid-template-columns: 1fr; }
    .wizard-aside { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; padding: 18px 18px; box-shadow: var(--shadow-1); position: sticky; top: 16px; }
    .wizard-aside h4 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: -0.005em; }
    .wizard-aside dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; column-gap: 12px; row-gap: 8px; font-size: 12.5px; }
    .wizard-aside dt { color: var(--color-text-tertiary); }
    .wizard-aside dd { margin: 0; color: var(--color-text-primary); word-break: break-word; }

    .form-grid { display: grid; gap: 16px; }
    .form-grid--2 { grid-template-columns: 1fr 1fr; }
    .textarea { width: 100%; min-height: 92px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 6px; padding: 10px 12px; font-family: inherit; font-size: 14px; color: var(--color-text-primary); resize: vertical; outline: none; transition: border-color var(--duration-fast), box-shadow var(--duration-fast); }
    .textarea:focus { border-color: var(--color-border-focus); box-shadow: var(--shadow-focus); }

    /* Contract pickers */
    .pick-card { display: flex; gap: 14px; padding: 18px; border: 1px solid var(--color-border-default); border-radius: 12px; background: var(--color-bg-2); cursor: pointer; transition: all var(--duration-fast); position: relative; }
    .pick-card:hover { border-color: var(--color-border-strong); background: var(--color-bg-hover); }
    .pick-card.is-on { border-color: var(--color-primary-700); background: var(--color-primary-50); box-shadow: 0 0 0 3px oklch(40% 0.14 262 / 0.08); }
    .pick-card__icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; }
    .pick-card__icon--isv { background: oklch(93% 0.05 265); color: var(--color-accent-700); }
    .pick-card__icon--iso { background: oklch(96% 0.03 230); color: var(--color-info-700); }
    .pick-card__icon--merchant { background: oklch(95% 0.04 190); color: oklch(48% 0.13 190); }
    .pick-card__icon--admin { background: oklch(94% 0.02 280); color: oklch(38% 0.05 280); }
    .pick-card__title { font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em; }
    .pick-card__desc { font-size: 12.5px; color: var(--color-text-secondary); margin-top: 4px; line-height: 1.5; }
    .pick-card__check { position: absolute; top: 14px; right: 14px; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--color-border-strong); display: grid; place-items: center; background: var(--color-bg-2); transition: all var(--duration-fast); }
    .pick-card.is-on .pick-card__check { background: var(--color-primary-700); border-color: var(--color-primary-700); color: #fff; }

    .seg { display: inline-flex; padding: 3px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 8px; }
    .seg__btn { padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--color-text-secondary); background: transparent; border: 0; cursor: pointer; transition: all var(--duration-fast); display: inline-flex; align-items: center; gap: 6px; }
    .seg__btn.is-on { background: var(--color-bg-2); color: var(--color-text-primary); box-shadow: var(--shadow-1); }

    /* Invite link box */
    .link-box { display: flex; align-items: center; background: var(--color-bg-3); border: 1px solid var(--color-border-default); border-radius: 8px; padding: 10px 12px; font-family: var(--font-family-mono); font-size: 12.5px; color: var(--color-text-primary); gap: 10px; }
    .link-box__url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qr-block { display: flex; gap: 16px; align-items: center; padding: 16px; background: var(--color-bg-3); border-radius: 10px; border: 1px dashed var(--color-border-default); }
    .qr-block svg { background: #fff; padding: 6px; border-radius: 4px; }

    /* Detail page */
    .det-header { display: flex; align-items: flex-start; gap: 18px; padding: 24px 28px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); margin-bottom: 0; }
    .det-header__logo { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 22px; color: #fff; letter-spacing: -0.02em; flex: none; }
    .det-header__main { flex: 1; min-width: 0; }
    .det-header__title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
    .det-header__meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--color-text-secondary); }
    .det-header__meta span { display: inline-flex; align-items: center; gap: 6px; }
    .det-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border-default); margin-bottom: 20px; padding: 0 4px; }

    /* Info grid */
    /* Most-recent password reset record */
    .rst-record { display: flex; gap: 14px; padding: 18px 20px; }
    .rst-record__icon { width: 36px; height: 36px; border-radius: 10px; background: var(--color-info-50); color: var(--color-info-700); display: grid; place-items: center; border: 1px solid oklch(60% 0.14 230 / 0.25); flex: none; }
    .rst-record__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .rst-record__head { display: flex; align-items: center; gap: 10px; }
    .rst-record__title { font-size: 13.5px; color: var(--color-text-primary); flex: 1; min-width: 0; }
    .rst-record__meta { font-size: 12.5px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .rst-record__meta .dot { color: var(--color-text-tertiary); }
    .rst-record__meta strong { color: var(--color-text-primary); font-weight: 600; }
    .rst-record__token { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11.5px; }
    .rst-record__token code { font: 500 11.5px var(--font-family-mono); padding: 2px 6px; background: var(--color-bg-3); border-radius: 4px; border: 1px solid var(--color-border-subtle); color: var(--color-text-secondary); }
    .rst-status { font: 600 10px var(--font-family-mono); letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px; border: 1px solid; flex: none; text-transform: uppercase; }
    .rst-status--pending { color: var(--color-warning-700); background: var(--color-warning-50); border-color: oklch(75% 0.14 75 / 0.3); }
    .rst-status--ok      { color: var(--color-success-700); background: var(--color-success-50); border-color: oklch(58% 0.14 152 / 0.25); }
    .rst-status--muted   { color: var(--color-text-tertiary); background: var(--color-bg-3); border-color: var(--color-border-subtle); }

    /* Role row — clickable user count badge */
    .pu-role__count { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); color: var(--color-text-secondary); font: 600 11.5px var(--font-family-sans); cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; flex: none; }
    .pu-role__count:hover { background: var(--color-primary-50); color: var(--color-primary-700); border-color: oklch(60% 0.14 262 / 0.3); }
    .pu-role__count svg { color: currentColor; flex: none; }

    /* Role-users modal list (also reused for Role detail's assigned-users list) */
    .rum-list { display: flex; flex-direction: column; gap: 1px; background: var(--color-border-subtle); border: 1px solid var(--color-border-subtle); border-radius: 10px; overflow: hidden; max-height: 360px; overflow-y: auto; }
    .rum-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--color-bg-2); }
    .rum-row__avatar { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--color-primary-500), var(--color-accent-600)); color: #fff; display: grid; place-items: center; font: 600 12px var(--font-family-sans); letter-spacing: 0.04em; flex: none; }
    .rum-row__main { flex: 1; min-width: 0; }
    .rum-row__name { font-size: 13.5px; font-weight: 600; color: var(--color-text-primary); }
    .rum-row__email { font: 500 11.5px var(--font-family-mono); color: var(--color-text-tertiary); margin-top: 2px; }
    .info-card { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); overflow: hidden; }
    .info-card__head { padding: 14px 20px; border-bottom: 1px solid var(--color-border-subtle); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .info-card--collapsible.is-open .info-card__head { border-bottom: 1px solid var(--color-border-subtle); }
    .info-card--collapsible:not(.is-open) .info-card__head { border-bottom: 0; }
    .info-card__head--btn { background: transparent; border: 0; width: 100%; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: background 0.15s; }
    .info-card__head--btn:hover { background: var(--color-bg-3); }
    .info-card__chev { display: grid; place-items: center; width: 24px; height: 24px; color: var(--color-text-tertiary); transition: transform 0.2s, color 0.15s; flex: none; }
    .info-card__chev.is-open { transform: rotate(180deg); color: var(--color-text-secondary); }
    .info-card__title { font-size: 14px; font-weight: 600; }
    .info-card__body { padding: 20px; }
    .kvgrid { display: grid; grid-template-columns: 160px 1fr; row-gap: 14px; column-gap: 20px; font-size: 13.5px; }
    .kvgrid dt { color: var(--color-text-tertiary); font-weight: 500; }
    .kvgrid dd { margin: 0; color: var(--color-text-primary); }

    /* Operators */
    .op-mask { font-family: var(--font-family-mono); font-size: 12.5px; color: var(--color-text-primary); letter-spacing: 0.02em; }
    .reveal-btn { background: transparent; border: 0; color: var(--color-primary-500); font-size: 12px; font-weight: 500; cursor: pointer; padding: 0; margin-left: 8px; }
    .reveal-btn:hover { text-decoration: underline; }

    /* Timeline */
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before { content: ''; position: absolute; left: 11px; top: 6px; bottom: 6px; width: 1px; background: var(--color-border-default); }
    .tl-row { position: relative; padding: 4px 0 22px; }
    .tl-row__dot { position: absolute; left: -22px; top: 8px; width: 14px; height: 14px; border-radius: 50%; background: var(--color-bg-2); border: 2px solid var(--color-border-strong); }
    .tl-row__dot--success { border-color: var(--color-success-500); background: var(--color-success-50); }
    .tl-row__dot--info { border-color: var(--color-info-500); background: var(--color-info-50); }
    .tl-row__dot--warning { border-color: var(--color-warning-500); background: var(--color-warning-50); }
    .tl-row__dot--neutral { border-color: var(--color-border-strong); }
    .tl-row__title { font-size: 13.5px; font-weight: 500; }
    .tl-row__meta { font-size: 12px; color: var(--color-text-tertiary); margin-top: 3px; display: flex; gap: 10px; align-items: center; }
    .tl-row__desc { font-size: 12.5px; color: var(--color-text-secondary); margin-top: 4px; }

    /* Stats strip */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }

    /* Customer locked chip + banner */
    .cust-lockchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px; background: var(--color-error-50); color: var(--color-error-700); border: 1px solid oklch(70% 0.16 25 / 0.35); font: 700 9.5px var(--font-family-mono); letter-spacing: 0.06em; flex: none; }
    .cust-lockchip svg { color: currentColor; flex: none; }
    .cust-lockbanner { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; background: var(--color-error-50); border: 1px solid oklch(70% 0.16 25 / 0.35); border-radius: 12px; margin-bottom: 16px; }
    .cust-lockbanner__icon { width: 32px; height: 32px; border-radius: 8px; background: oklch(70% 0.16 25 / 0.15); color: var(--color-error-700); display: grid; place-items: center; flex: none; }
    .cust-lockbanner__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .cust-lockbanner__title { font-size: 13.5px; font-weight: 600; color: var(--color-error-700); }
    .cust-lockbanner__sub { font-size: 12.5px; color: var(--color-text-secondary); line-height: 1.5; }
    .cust-lockbanner__sub strong { color: var(--color-text-primary); font-weight: 600; }
    .stat { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow-1); position: relative; }
    .stat.is-clickable { cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.08s; text-align: left; font: inherit; color: inherit; appearance: none; width: 100%; display: block; }
    .stat.is-clickable:hover { border-color: var(--color-border-strong); background: var(--color-bg-1); }
    .stat.is-clickable:active { transform: scale(0.99); }
    .stat.is-clickable:focus-visible { outline: 2px solid var(--color-primary-500); outline-offset: 2px; }
    .stat.is-active { border-color: var(--color-primary-500); box-shadow: 0 0 0 1px var(--color-primary-500), var(--shadow-1); background: var(--color-primary-50, #f5f3ff); }
    .stat__action { display: flex; align-items: center; gap: 3px; margin-top: 8px; font-size: 10.5px; color: var(--color-primary-700); font-weight: 500; letter-spacing: 0.02em; text-transform: uppercase; opacity: 0; transition: opacity 0.15s; }
    .stat.is-clickable:hover .stat__action, .stat.is-active .stat__action { opacity: 1; }
    .stat.is-active .stat__action::before { content: '✓ '; }
    .stat__label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-tertiary); font-weight: 500; }
    .stat__val { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .stat__delta { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; display: none; }
    .stat__delta--up { color: var(--color-success-700); }

    /* Contract row */
    .crow { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--color-border-subtle); }
    .crow:last-child { border-bottom: 0; }
    .crow--clickable { cursor: pointer; transition: background var(--duration-fast); }
    .crow--clickable:hover { background: var(--color-bg-hover); }
    .crow--clickable:focus-visible { outline: 2px solid var(--color-primary-500); outline-offset: -2px; }
    .crow__main { flex: 1; min-width: 0; }
    .crow__title { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .crow__sub { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }
    .crow__actions { display: flex; gap: 6px; }

    /* Contract detail view — Identity + Effective window (polished metadata) */
    .cv-meta { display: grid; grid-template-columns: max-content 1fr; row-gap: 11px; column-gap: 18px; align-items: center; }
    .cv-meta__k { font: 500 11px var(--font-family-sans); color: var(--color-text-tertiary); letter-spacing: 0.06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
    .cv-meta__k svg { color: var(--color-text-tertiary); flex: none; }
    .cv-meta__v { font-size: 13px; color: var(--color-text-primary); min-width: 0; }
    .cv-issuer { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 10px; margin-bottom: 14px; }
    .cv-issuer__avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--color-bg-2); border: 1px solid var(--color-border-default); display: grid; place-items: center; font: 600 14px var(--font-family-mono); color: var(--color-text-secondary); flex: none; letter-spacing: 0.02em; }
    .cv-issuer__name { font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
    .cv-issuer__role { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; }
    .cv-issuer__role strong { color: var(--color-text-secondary); font-weight: 600; }
    .cv-issuer__when { flex: none; text-align: right; align-self: center; }
    .cv-issuer__when-k { font: 500 10px var(--font-family-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-tertiary); }
    .cv-issuer__when-v { font-size: 12.5px; color: var(--color-text-primary); margin-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .cv-span { display: flex; align-items: stretch; gap: 10px; }
    .cv-spancell { flex: 1; min-width: 0; padding: 11px 14px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 10px; }
    .cv-spancell__k { font: 500 10.5px var(--font-family-sans); color: var(--color-text-tertiary); letter-spacing: 0.06em; text-transform: uppercase; }
    .cv-spancell__v { font-size: 14px; font-weight: 600; color: var(--color-text-primary); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .cv-spancell__v--muted { color: var(--color-text-secondary); font-weight: 500; font-style: italic; }
    .cv-span__arrow { display: grid; place-items: center; color: var(--color-text-tertiary); flex: none; }
    .cv-termedit { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .cv-strip { margin-top: 16px; padding: 16px 16px 6px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 10px; }
    /* Entitlements — read-only spec grid (label column + value column) */
    .cv-ents { display: grid; grid-template-columns: minmax(150px, max-content) 1fr; margin: 0; border: 1px solid var(--color-border-subtle); border-radius: 10px; overflow: hidden; }
    .cv-ents__k { padding: 11px 14px; background: var(--color-bg-3); font: 500 11px var(--font-family-sans); letter-spacing: 0.05em; text-transform: uppercase; color: var(--color-text-tertiary); border-bottom: 1px solid var(--color-border-subtle); display: flex; align-items: center; }
    .cv-ents__v { padding: 11px 14px; font-size: 13px; color: var(--color-text-primary); border-bottom: 1px solid var(--color-border-subtle); display: flex; align-items: center; flex-wrap: wrap; gap: 5px; min-width: 0; }
    .cv-ents > :nth-last-child(1), .cv-ents > :nth-last-child(2) { border-bottom: 0; }

    /* Empty / generic */
    .empty { padding: 60px 20px; text-align: center; color: var(--color-text-tertiary); font-size: 13px; }

    /* Notice banner */
    .notice { display: flex; gap: 10px; padding: 10px 14px; background: var(--color-info-50); border: 1px solid oklch(60% 0.14 230 / 0.25); border-radius: 8px; font-size: 12.5px; color: var(--color-info-700); align-items: flex-start; }
    .notice svg { flex: none; margin-top: 1px; }

    /* Operator action menu */
    .opmenu-wrap { position: relative; display: inline-block; }
    .opmenu { z-index: var(--z-popover); min-width: 200px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 8px; box-shadow: var(--shadow-4); padding: 4px; }
    .opmenu__item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 5px; font-size: 13px; color: var(--color-text-primary); cursor: pointer; background: transparent; border: 0; width: 100%; text-align: left; }
    .opmenu__item:hover { background: var(--color-bg-hover); }
    .opmenu__item--danger { color: var(--color-error-700); }
    .opmenu__item--danger:hover { background: var(--color-error-50); }
    .opmenu__item[disabled] { opacity: 0.45; cursor: not-allowed; }
    .opmenu__sep { height: 1px; background: var(--color-border-subtle); margin: 4px 2px; }
    .opmenu__item svg { color: var(--color-text-tertiary); flex: none; }
    .opmenu__item--danger svg { color: var(--color-error-500); }
    .opmenu__pendmark { margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--color-warning-700); background: var(--color-warning-50); border: 1px solid oklch(75% 0.14 75 / 0.3); padding: 0 5px; border-radius: 3px; letter-spacing: 0.04em; }

    /* ─── Approval workflow ──────────────────────────────── */
    /* Pending-request marker chips */
    .pendchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 4px; font: 600 10.5px var(--font-family-sans); border: 1px solid transparent; cursor: pointer; line-height: 1.4; }
    .pendchip--warn   { background: var(--color-warning-50); color: var(--color-warning-700); border-color: oklch(75% 0.14 75 / 0.3); }
    .pendchip--info   { background: var(--color-info-50);    color: var(--color-info-700);    border-color: oklch(60% 0.14 230 / 0.3); }
    .pendchip--cancel { background: var(--color-bg-2);       color: var(--color-text-secondary); border-color: var(--color-border-default); }
    .pendchip--cancel:hover { background: var(--color-error-50); color: var(--color-error-700); border-color: oklch(58% 0.20 25 / 0.3); }
    .pendchip:hover { filter: brightness(0.97); }

    /* Diff box (used in submit modals) */
    .diff { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; padding: 14px; background: var(--color-bg-3); border-radius: 8px; }
    .diff__col h5 { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-tertiary); font-weight: 600; margin: 0 0 6px; }
    .diff__val { font-family: var(--font-family-mono); font-size: 13px; color: var(--color-text-primary); font-weight: 500; word-break: break-all; }
    .diff__col--old .diff__val { color: var(--color-text-tertiary); text-decoration: line-through; }
    .diff__col--new .diff__val { color: var(--color-success-700); }
    .diff__arrow { color: var(--color-text-tertiary); display: grid; place-items: center; }

    /* Approval card list (Approvals page rows) */
    .alist { display: flex; flex-direction: column; }
    .acard { display: grid; grid-template-columns: 32px 1fr auto; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--color-border-subtle); align-items: flex-start; }
    .acard:last-child { border-bottom: 0; }
    .acard__icon { width: 32px; height: 32px; border-radius: 8px; background: var(--color-bg-3); color: var(--color-text-secondary); display: grid; place-items: center; flex: none; }
    .acard__icon--warn { background: var(--color-warning-50); color: var(--color-warning-700); border: 1px solid oklch(75% 0.14 75 / 0.3); }
    .acard__icon--info { background: var(--color-info-50); color: var(--color-info-700); border: 1px solid oklch(60% 0.14 230 / 0.25); }
    .acard__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 600 11px var(--font-family-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-tertiary); }
    .acard__title { font-size: 13.5px; font-weight: 600; margin-top: 4px; line-height: 1.45; color: var(--color-text-primary); }
    .acard__meta { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--color-text-secondary); flex-wrap: wrap; }
    .acard__diff { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; margin-top: 8px; background: var(--color-bg-3); border-radius: 6px; font: 500 12.5px var(--font-family-mono); color: var(--color-text-primary); border: 1px solid var(--color-border-subtle); }
    .acard__diff .old { color: var(--color-text-tertiary); text-decoration: line-through; }
    .acard__diff svg { color: var(--color-text-tertiary); }
    .acard__actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    /* Approvals "Load more" spinner — mirrors shop-browse */
    .aw-loadmore__spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: aw-spin 0.7s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes aw-spin { to { transform: rotate(360deg); } }

    /* Approval-page subtabs (To review · Submitted) */
    .subtabs { display: flex; gap: 4px; padding: 8px 20px 0; border-bottom: 1px solid var(--color-border-subtle); }
    .subtab { padding: 8px 12px 10px; font-size: 13px; font-weight: 500; color: var(--color-text-secondary); border: 0; background: transparent; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; align-items: center; gap: 6px; font-family: inherit; }
    .subtab:hover { color: var(--color-text-primary); }
    .subtab.is-on { color: var(--color-text-primary); border-bottom-color: var(--color-primary-700); }
    .subtab .count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--color-bg-3); color: var(--color-text-secondary); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; border: 1px solid var(--color-border-subtle); }
    .subtab.is-on .count { background: var(--color-primary-50); border-color: oklch(60% 0.14 262 / 0.25); color: var(--color-primary-700); }

    /* Notifications list (on Approvals page) */
    .nlist { display: flex; flex-direction: column; }
    .notif { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--color-border-subtle); align-items: flex-start; }
    .notif:last-child { border-bottom: 0; }
    .notif__icon { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; flex: none; }
    .notif__icon--email { background: var(--color-info-50); color: var(--color-info-700); border: 1px solid oklch(60% 0.14 230 / 0.25); }
    .notif__icon--inapp { background: var(--color-bg-3); color: var(--color-text-secondary); border: 1px solid var(--color-border-subtle); }
    .notif__head { font: 600 10.5px var(--font-family-sans); text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-tertiary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .notif__head code { font: 500 11px var(--font-family-mono); color: var(--color-text-secondary); text-transform: none; letter-spacing: 0; }
    .notif__title { font-size: 13px; font-weight: 600; margin-top: 3px; line-height: 1.4; color: var(--color-text-primary); }
    .notif__body { font-size: 12.5px; color: var(--color-text-secondary); margin-top: 4px; line-height: 1.55; }
    .notif__time { font-size: 11.5px; color: var(--color-text-tertiary); white-space: nowrap; }

    /* Empty title/sub used inside .alist and .nlist (existing .empty is fine for outer) */
    .alist .empty, .nlist .empty { padding: 36px 24px; }
    .empty__title { font-size: 13.5px; font-weight: 600; color: var(--color-text-secondary); }
    .empty__sub { font-size: 12.5px; margin-top: 4px; max-width: 320px; color: var(--color-text-tertiary); }
    .alist .empty svg, .nlist .empty svg { color: var(--color-text-tertiary); margin-bottom: 8px; }

    /* Sidebar count badge (Approvals pending) */
    .side__count { margin-left: auto; min-width: 18px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--color-error-700); color: #fff; font-size: 10.5px; font-weight: 600; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }

    /* Acting-as persona switcher button in topbar */
    .aw-persona-btn { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: 999px; border: 1px solid var(--color-border-default); background: var(--color-bg-2); cursor: pointer; font: inherit; transition: background var(--duration-fast); }
    .aw-persona-btn:hover { background: var(--color-bg-hover); }
    .aw-persona-avatar { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, var(--color-primary-500), var(--color-primary-700)); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }

    /* Tweaks wrapper override */
    .tds-toast-stack { bottom: 80px; }

    /* ─── User card (sidebar footer) ─────────────────────── */
    .side__user { width: 100%; background: transparent; border: 0; cursor: pointer; padding: 12px 14px; font-family: inherit; transition: background var(--duration-fast); position: relative; }
    .side__user:hover { background: var(--color-bg-hover); }
    .side__user.is-open, .side__user.is-active { background: var(--color-bg-2); }
    .side__user.is-open::before, .side__user.is-active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--color-primary-500); }
    .side__user__chev { display: grid; place-items: center; width: 18px; height: 18px; color: var(--color-text-tertiary); transition: transform var(--duration-fast); flex: none; }
    .side__user:hover .side__user__chev { color: var(--color-text-secondary); }
    .side__user.is-open .side__user__chev { transform: rotate(-90deg); color: var(--color-primary-500); }

    /* ─── User menu popover ──────────────────────────────── */
    .um-pop { position: fixed; left: 12px; bottom: 78px; width: 296px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-5); z-index: 1090; overflow: hidden; animation: umPopIn 0.16s var(--easing-emphasized); }
    @keyframes umPopIn { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .um-views { display: flex; width: 300%; transition: transform var(--duration-normal) var(--easing-emphasized); }
    .um-views--main { transform: translateX(0); }
    .um-views--theme { transform: translateX(calc(-100% / 3)); }
    .um-views--lang { transform: translateX(calc(-200% / 3)); }
    .um-view { width: calc(100% / 3); flex: none; }

    .um-head { display: flex; gap: 12px; padding: 16px 16px 14px; border-bottom: 1px solid var(--color-border-subtle); background: linear-gradient(180deg, var(--color-bg-3), var(--color-bg-2)); }
    .um-head__avatar { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; background: linear-gradient(135deg, var(--color-primary-500), var(--color-accent-600)); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; flex: none; }
    .um-head__main { flex: 1; min-width: 0; }
    .um-head__name { font-size: 13.5px; font-weight: 600; color: var(--color-text-primary); letter-spacing: -0.01em; }
    .um-head__email { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .um-head__chips { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
    .um-chip { display: inline-flex; align-items: center; gap: 4px; font: 500 10.5px/1 var(--font-family-sans); padding: 3px 7px; border-radius: 999px; background: var(--color-bg-3); color: var(--color-text-secondary); border: 1px solid var(--color-border-subtle); white-space: nowrap; }
    .um-chip--admin { background: var(--color-primary-50); color: var(--color-primary-700); border-color: oklch(60% 0.14 262 / 0.25); }

    .um-section { padding: 4px; }
    .um-section--bordered { border-top: 1px solid var(--color-border-subtle); }

    .um-row { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-family: inherit; text-align: left; transition: background var(--duration-fast); }
    .um-row:hover { background: var(--color-bg-hover); }
    .um-row__icon { width: 24px; height: 24px; border-radius: 6px; background: var(--color-bg-3); color: var(--color-text-secondary); display: grid; place-items: center; flex: none; transition: all var(--duration-fast); }
    .um-row:hover .um-row__icon { background: var(--color-bg-2); color: var(--color-text-primary); }
    .um-row__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .um-row__label { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
    .um-row__sub { font-size: 11.5px; color: var(--color-text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .um-row__trail { font-size: 12px; color: var(--color-text-tertiary); display: inline-flex; align-items: center; gap: 4px; flex: none; }
    .um-row__trail--muted { font-weight: 500; }
    .um-row__trail--primary { color: var(--color-primary-500); }
    .um-row--danger .um-row__label { color: var(--color-error-700); }
    .um-row--danger .um-row__icon { color: var(--color-error-700); background: var(--color-error-50); }
    .um-row--danger:hover { background: var(--color-error-50); }
    .um-kbd { font: 500 10.5px/1 var(--font-family-mono); padding: 2px 5px; border-radius: 4px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); color: var(--color-text-tertiary); }

    .um-subhead { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--color-border-subtle); background: var(--color-bg-3); }
    .um-subhead__title { font-size: 13px; font-weight: 600; color: var(--color-text-primary); margin-left: 4px; }
    .um-back { display: inline-flex; align-items: center; gap: 4px; background: transparent; border: 0; padding: 4px 8px; border-radius: 5px; font: 500 12px var(--font-family-sans); color: var(--color-text-secondary); cursor: pointer; font-family: inherit; }
    .um-back:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }

    .um-note { padding: 8px 10px; margin: 4px 6px 6px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); border-radius: 6px; font-size: 11px; color: var(--color-text-tertiary); line-height: 1.45; }

    /* ─── Signed-out screen ───────────────────────────────── */
    .signedout { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; background: var(--color-bg-1); }
    .signedout__card { width: min(420px, 92vw); padding: 36px 32px; text-align: center; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 16px; box-shadow: var(--shadow-4); }
    .signedout__logo { width: 56px; height: 56px; margin: 0 auto 18px; display: grid; place-items: center; }
    .signedout__logo img { width: 100%; height: 100%; object-fit: contain; }
    .__signedout_logo_legacy_dead { background: var(--color-primary-700); color: #fff; border-radius: 12px; font-weight: 700; font-size: 22px; box-shadow: var(--shadow-cta); }
    .signedout__title { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.02em; }
    .signedout__sub { font-size: 13.5px; color: var(--color-text-secondary); margin: 0 0 22px; line-height: 1.55; }
    .signedout__hint { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 14px; }

    /* ─── User sub-pages (shared shell) ───────────────────── */
    .up-page { max-width: 980px; }
    .up-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
    .up-header__icon { width: 44px; height: 44px; border-radius: 12px; background: var(--color-primary-50); color: var(--color-primary-700); display: grid; place-items: center; flex: none; border: 1px solid oklch(60% 0.14 262 / 0.18); }
    .up-header__main { flex: 1; min-width: 0; }
    .up-header__title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
    .up-header__sub { font-size: 13.5px; color: var(--color-text-secondary); margin: 0; line-height: 1.5; }
    .up-header__actions { display: flex; gap: 8px; align-items: center; flex: none; }

    .up-card { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); overflow: hidden; }
    .up-card + .up-card { margin-top: 16px; }
    .up-card__head { padding: 14px 20px; border-bottom: 1px solid var(--color-border-subtle); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .up-card__title { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -0.005em; }
    .up-card__sub { font-size: 12.5px; color: var(--color-text-tertiary); margin: 4px 0 0; line-height: 1.4; }
    .up-card__body { padding: 4px 0; }
    .up-card--danger { border-color: oklch(70% 0.16 25 / 0.4); }
    .up-card--danger .up-card__head { background: var(--color-error-50); border-bottom-color: oklch(70% 0.16 25 / 0.25); }

    .up-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
    .up-grid--single { grid-template-columns: minmax(0, 1fr); }
    @media (max-width: 880px) { .up-grid { grid-template-columns: 1fr; } }

    .up-row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--color-border-subtle); }
    .up-row:last-child { border-bottom: 0; }
    .up-row__main { flex: 1; min-width: 0; }
    .up-row__title { font-size: 13.5px; font-weight: 500; color: var(--color-text-primary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .up-row__sub { font-size: 12px; color: var(--color-text-tertiary); margin-top: 3px; }

    .up-badge { display: inline-flex; align-items: center; gap: 3px; font: 600 10px/1 var(--font-family-sans); padding: 3px 7px; border-radius: 999px; letter-spacing: 0.04em; text-transform: uppercase; }
    .up-badge--ok { background: var(--color-success-50); color: var(--color-success-700); border: 1px solid oklch(58% 0.14 152 / 0.25); }

    .up-toggle { width: 36px; height: 22px; border-radius: 999px; border: 0; background: var(--color-border-strong); position: relative; cursor: pointer; padding: 0; transition: background var(--duration-fast); flex: none; }
    .up-toggle.is-on { background: var(--color-primary-700); }
    .up-toggle__dot { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left var(--duration-fast); box-shadow: 0 1px 3px oklch(0% 0 0 / 0.2); }
    .up-toggle.is-on .up-toggle__dot { left: 16px; }

    /* Free-form content inside an .up-card__body — rows/grids/activity manage their own insets,
       but free text/profile/stats need an explicit gutter. */
    .up-card__body > .up-profile,
    .up-card__body > .kvgrid,
    .up-card__body > p { padding-left: 20px; padding-right: 20px; }
    .up-card__body > p { padding-top: 16px; padding-bottom: 4px; margin: 0; }
    .up-card__body > .kvgrid { padding-top: 18px; padding-bottom: 20px; margin-top: 0 !important; }

    /* Profile */
    /* Profile — unified settings card */
    .up-id { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--color-border-subtle); }
    .up-id__avatar { width: 52px; height: 52px; border-radius: 13px; background: linear-gradient(135deg, var(--color-primary-500), var(--color-accent-600)); color: #fff; display: grid; place-items: center; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; flex: none; }
    .up-id__name { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
    .up-id__handle { font-family: var(--font-family-mono); font-size: 12.5px; color: var(--color-text-tertiary); margin-top: 3px; }

    /* Avatar — clickable, with an edit affordance + optional uploaded photo */
    .up-id__avatar-btn { position: relative; flex: none; padding: 0; border: none; background: none; cursor: pointer; border-radius: 13px; line-height: 0; }
    .up-id__avatar-btn:focus-visible { outline: 2px solid var(--color-primary-500); outline-offset: 2px; }
    .up-id__avatar--img { object-fit: cover; }
    .up-id__avatar-edit { position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--color-bg-2); border: 1px solid var(--color-border-default); color: var(--color-text-secondary); display: grid; place-items: center; box-shadow: var(--shadow-1); transition: color .12s, border-color .12s; }
    .up-id__avatar-btn:hover .up-id__avatar-edit { color: var(--color-primary-600); border-color: var(--color-primary-500); }

    /* Profile-photo dialog */
    .av-edit { display: flex; gap: 18px; align-items: flex-start; }
    .av-edit__preview { width: 88px; height: 88px; border-radius: 18px; overflow: hidden; flex: none; }
    .av-edit__img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .av-edit__fallback { width: 100%; height: 100%; display: grid; place-items: center; color: #fff; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
    .av-edit__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .av-drop { border: 1.5px dashed var(--color-border-strong); border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; background: var(--color-bg-1); transition: border-color .12s, background .12s; }
    .av-drop:hover, .av-drop.is-drag { border-color: var(--color-primary-500); background: var(--color-primary-50); }
    .av-drop__icon { width: 34px; height: 34px; margin: 0 auto 6px; border-radius: 9px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); color: var(--color-text-secondary); display: grid; place-items: center; }
    .av-drop__title { font-size: 13.5px; font-weight: 600; color: var(--color-text-primary); }
    .av-drop__sub { font-size: 11px; color: var(--color-text-tertiary); margin-top: 3px; }
    .av-remove { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border: none; background: none; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 500; color: var(--color-error-700); border-radius: 7px; }
    .av-remove:hover { background: var(--color-bg-3); }
    .av-colors { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--color-border-subtle); }
    .av-colors__label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--color-text-tertiary); margin-bottom: 10px; }
    .av-colors__row { display: flex; gap: 10px; flex-wrap: wrap; }
    .av-swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; display: grid; place-items: center; color: #fff; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
    .av-swatch.is-on { border-color: var(--color-text-primary); }

    .up-sec + .up-sec { border-top: 1px solid var(--color-border-subtle); }
    .up-sec__title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--color-text-tertiary); padding: 16px 20px 4px; }

    .up-frow { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 11px 20px; }
    .up-frow__label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; font-weight: 500; color: var(--color-text-primary); }
    .up-frow__val { font-size: 12.5px; font-weight: 400; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .up-frow__ctrl { width: 340px; flex: none; }
    .up-frow__ctrl .tds-input, .up-frow__ctrl .tds-select { width: 100%; }
    .up-frow__ctrl--action { display: flex; justify-content: flex-end; }
    @media (max-width: 620px) { .up-frow { flex-direction: column; align-items: stretch; gap: 8px; } .up-frow__ctrl { width: auto; } .up-frow__ctrl--action { justify-content: flex-start; } }

    .up-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--color-border-subtle); background: var(--color-bg-3); }

    /* Identity change flow (modal contents) */
    .flow-step__desc { margin: 0 0 14px; font-size: 13.5px; line-height: 1.6; color: var(--color-text-secondary); }
    .flow-step__desc strong { color: var(--color-text-primary); font-weight: 600; }
    .flow-step__err { margin-top: 10px; font-size: 12.5px; color: var(--color-error-700); }
    .otp-input { width: 100%; height: 52px; text-align: center; font-family: var(--font-family-mono); font-size: 26px; letter-spacing: 0.5em; text-indent: 0.5em; border: 1px solid var(--color-border-default); border-radius: 10px; background: var(--color-bg-1); color: var(--color-text-primary); }
    .otp-input:focus { outline: none; border-color: var(--color-primary-700); box-shadow: var(--shadow-focus); }
    .otp-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .otp-resend { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; font-size: 12.5px; color: var(--color-primary-700); }
    .otp-resend:hover { text-decoration: underline; }
    .otp-hint { font-size: 12px; color: var(--color-text-tertiary); }
    .otp-hint strong { font-family: var(--font-family-mono); color: var(--color-text-secondary); }
    .flow-step--done { text-align: center; padding: 8px 0; }
    .flow-done__icon { width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%; background: var(--color-success-50); color: var(--color-success-700); display: grid; place-items: center; }
    .flow-step--done .flow-step__desc { margin-bottom: 0; }
    .flow-foot { display: flex; gap: 8px; justify-content: flex-end; }
    /* Change-password flow */
    .flow-note { display: flex; gap: 8px; align-items: flex-start; margin-top: 14px; padding: 10px 12px; background: var(--color-info-50); border: 1px solid var(--color-border-subtle); border-radius: 8px; font-size: 12.5px; line-height: 1.5; color: var(--color-text-secondary); }
    .flow-note svg { color: var(--color-info-700); flex: none; margin-top: 1px; }
    .flow-note strong { color: var(--color-text-primary); font-weight: 600; }
    .flow-demo { margin-top: 12px; font-size: 12px; color: var(--color-text-tertiary); }
    .flow-demo strong { font-family: var(--font-family-mono); color: var(--color-text-secondary); font-weight: 500; }
    .flow-step .tds-field + .tds-field { margin-top: 12px; }
    .flow-reqs { list-style: none; margin: 12px 0 4px; padding: 0; display: grid; gap: 7px; }
    .flow-req { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--color-text-tertiary); }
    .flow-req__dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--color-bg-3); color: var(--color-text-tertiary); flex: none; transition: background var(--duration-fast) var(--easing-standard); }
    .flow-req.is-ok { color: var(--color-text-secondary); }
    .flow-req.is-ok .flow-req__dot { background: var(--color-success-50); color: var(--color-success-700); }
    .pw-reveal { border: 0; background: none; padding: 0 2px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 500; color: var(--color-primary-700); }
    /* MFA: reconfigure authenticator + security key */
    .qr-wrap { display: flex; justify-content: center; margin: 6px 0 16px; }
    .qr { display: grid; gap: 0; padding: 9px; background: #fff; border: 1px solid var(--color-border-default); border-radius: 10px; box-shadow: var(--shadow-1); }
    .qr__c { width: 100%; height: 100%; }
    .qr__c.is-on { background: var(--color-text-primary); }
    .setupkey { display: flex; flex-direction: column; gap: 6px; align-items: center; }
    .setupkey__label { font-size: 12px; color: var(--color-text-tertiary); }
